name: daily signal

# Two runs a day, doing deliberately different jobs. See ADR 0005.
#
#   intraday (15:45 ET)  the ACTIONABLE run. Decides on a live quote so the order
#                        can go into the same close. Worth ~8pp of max drawdown
#                        per unit of average leverage. Does NOT touch data/*.csv.
#   settled  (after close) the RECORD run. Appends the real closes, re-derives
#                        from settled data, opens the rebalance issue, deploys.
#
# Cron is scheduled ~20 minutes EARLY and scripts/quote.py sleeps to 15:45 ET,
# because Actions cron fires late under load and a 5-minute window is not
# something the scheduler can be trusted to hit. The DST pair exists because
# Actions cron has no timezone: 15:25 ET is 19:25 UTC in summer and 20:25 UTC in
# winter. Whichever one is wrong for the current half of the year lands outside
# the session and the guard step skips it.
on:
  schedule:
    - cron: "25 19 * * 1-5"   # 15:25 EDT -> intraday
    - cron: "25 20 * * 1-5"   # 15:25 EST -> intraday
    - cron: "0 23 * * 1-5"    # after the close in both halves -> settled (ADR 0003)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run to simulate"
        type: choice
        options: [settled, intraday]
        default: settled
      full:
        description: "Re-download full history from scratch"
        type: boolean
        default: false

concurrency:
  group: daily-signal
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  signal:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event_name }}" in
            schedule)
              if [ "${{ github.event.schedule }}" = "0 23 * * 1-5" ]; then
                echo "mode=settled"  >> "$GITHUB_OUTPUT"
              else
                echo "mode=intraday" >> "$GITHUB_OUTPUT"
              fi ;;
            workflow_dispatch) echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "mode=settled"           >> "$GITHUB_OUTPUT" ;;
          esac

      # For the intraday run: sleep to 15:45 ET, then bail out if we are not
      # actually in the session (the wrong half of the DST pair, or a holiday).
      # `outcome=skip` short-circuits every later step but still lets the
      # notifier explain why nothing was sent.
      - name: Wait for the 15:45 ET window
        id: window
        if: steps.mode.outputs.mode == 'intraday'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys; sys.path.insert(0, "scripts")
          import quote
          state = quote.wait_for_window()
          p = quote.provisional()
          print(f"state={state}")
          print(f"go={'true' if p['usable'] else 'false'}")
          print(f"reason={state}/fresh={p['fresh']}")
          PY

      - name: Skip note
        if: steps.mode.outputs.mode == 'intraday' && steps.window.outputs.go != 'true'
        run: |
          echo "::notice::intraday run skipped (${{ steps.window.outputs.reason }})"
          echo "Not in the session — wrong half of the DST cron pair, or a market holiday."

      # ── settled run only ────────────────────────────────────────────────────
      # NEVER run this in intraday mode. fetch.py is append-only and an existing
      # date keeps its stored value, so writing today's in-progress bar at 15:45
      # would freeze a partial price into ndx.csv permanently. The intraday run
      # therefore reads committed history (settled through yesterday) and gets
      # today from the live quote, which is exactly the model measured in
      # tqqq-trend-lab/intraday_proxy.py.
      - name: Fetch settled closes
        if: steps.mode.outputs.mode == 'settled'
        run: python scripts/fetch.py ${{ inputs.full && '--full' || '' }}

      - name: Derive signal
        id: signal
        if: steps.mode.outputs.mode == 'settled' || steps.window.outputs.go == 'true'
        run: |
          python scripts/signal.py ${{ steps.mode.outputs.mode == 'intraday' && '--provisional' || '--stats' }}
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("data/signal.json"))
          acted = [s["key"] for s in d["nav"]
                   if d["strategies"][s["key"]]["latest"]["action_required"]]
          print(f"acted={' '.join(acted)}")
          print(f"any_changed={str(bool(acted)).lower()}")
          PY

      # ── the notification: one message per run, whatever happened ────────────
      # The intraday run is the actionable one, so it always speaks. The settled
      # run stays quiet unless it disagrees with what the intraday run said,
      # because two identical messages a day trains you to ignore both.
      - name: Notify (intraday)
        if: steps.mode.outputs.mode == 'intraday' && steps.window.outputs.go == 'true'
        run: python scripts/notify.py

      - name: Notify (settled, only if it disagrees)
        if: steps.mode.outputs.mode == 'settled'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          d = json.load(open("data/signal.json"))
          vt = d["strategies"]["voltarget"]["latest"]
          prev = None
          if os.path.exists("data/last_intraday.json"):
              prev = json.load(open("data/last_intraday.json"))
          disagree = prev is not None and abs(prev.get("weight", -1) - vt["weight"]) > 1e-9
          if disagree or vt["action_required"]:
              import notify
              acted, text = notify.build_ok()
              extra = ""
              if disagree:
                  extra = (f"\n\n⚠️ <b>장중 판정과 다르다</b>: 15:45 기준 "
                           f"{prev['weight']*100:.0f}% → 종가 기준 {vt['weight_pct']:.0f}%. "
                           f"이미 체결했다면 그대로 두고 다음 판정을 기다려라.")
              notify.send(text + extra)
          else:
              print("settled run agrees with the intraday call; staying quiet")
          PY

      - name: Remember the intraday call
        if: steps.mode.outputs.mode == 'intraday' && steps.window.outputs.go == 'true'
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/signal.json"))
          vt = d["strategies"]["voltarget"]["latest"]
          json.dump({"date": vt["date"], "weight": vt["weight"]},
                    open("data/last_intraday.json", "w"))
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_intraday.json
          git diff --cached --quiet || { git commit -m "intraday call $(date -u +%F)"; git push; }

      - name: Commit settled closes
        if: steps.mode.outputs.mode == 'settled'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "no new sessions, skipping commit"
          else
            git commit -m "data: closes through $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open rebalance issues
        if: steps.mode.outputs.mode == 'settled' && steps.signal.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/issue_body.py
          gh label create rebalance --color d73a4a --description "Signal wants a trade" --force
          for key in ${{ steps.signal.outputs.acted }}; do
            gh label create "strategy:$key" --color 0e8a16 --force
            gh issue create \
              --title "$(cat /tmp/$key.title)" \
              --body-file "/tmp/$key.md" \
              --label rebalance --label "strategy:$key"
            for n in $(gh issue list --label rebalance --label "strategy:$key" \
                         --state open --json number --jq '.[].number' | tail -n +2); do
              gh issue close "$n" --comment "Superseded by a newer $key signal."
            done
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      # A silent failure and a quiet day are indistinguishable to the person
      # holding the position, so failure has to be as loud as a trade.
      - name: Notify failure
        if: failure()
        env:
          FAILED_STEP: ${{ steps.mode.outputs.mode }} run
        run: python scripts/notify.py --fail || echo "::error::could not send the failure message"
