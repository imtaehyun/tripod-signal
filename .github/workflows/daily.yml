name: daily signal

on:
  schedule:
    # 23:00 UTC, Mon-Fri = 18:00 EST / 19:00 EDT, same session day.
    # Actions cron has no DST awareness, so a single UTC hour is chosen that
    # lands after the US close in BOTH halves of the year. See ADR 0003.
    - cron: "0 23 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download full history from scratch"
        type: boolean
        default: false

concurrency:
  group: daily-signal
  cancel-in-progress: false

permissions:
  contents: write   # commit refreshed raw CSVs
  issues: write     # open a rebalance issue on a gear change
  pages: write
  id-token: write

# Deliberately ONE job. The derived signal is not committed (see ADR 0001), so
# it exists only in this job's workspace -- a separate deploy job would check
# out a tree without it, and would also race the commit made here.
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python scripts/fetch.py ${{ inputs.full && '--full' || '' }}

      - name: Derive signal
        id: signal
        run: |
          python scripts/signal.py --stats
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("data/signal.json"))
          L, G = d["latest"], d["gears"]
          # action_required is trade-based: a G15_UP <-> G15_DOWN move changes
          # the gear key but not the book, so it must NOT raise a rebalance
          # issue telling you to place an order that does not exist.
          print(f"changed={str(L['action_required']).lower()}")
          print(f"regime_only={str(L['regime_only_change']).lower()}")
          prev = G[L["prev_gear"]]["label"] if L["prev_gear"] else "—"
          print(f"summary={L['date']} close -> {G[L['gear']]['label']} "
                f"({G[L['gear']]['leverage']}x), was {prev}")
          PY

      - name: Commit raw data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "no new sessions, skipping commit"
          else
            git commit -m "data: closes through $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open rebalance issue on gear change
        if: steps.signal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - > /tmp/body.md <<'PY'
          import json
          d = json.load(open("data/signal.json"))
          L, G, P = d["latest"], d["gears"], d["params"]
          g, prev = G[L["gear"]], G[L["prev_gear"]]
          legs, o = L["legs"], L["orders"]
          print(f"**{prev['label']} ({prev['leverage']}x) -> {g['label']} ({g['leverage']}x)**\n")
          print(f"Judged on the **{L['date']}** close. Per the rule, execute on the **next session**.\n")
          print("## Orders\n")
          step = 1
          if o["sell"]:
              print(f"{step}. Sell **100% of {', '.join(o['sell'])}**")
              step += 1
          if o["buy"]:
              tgt = " + ".join(f"{t} {g['weights'][t]*100:.0f}%" for t in o["buy"])
              src = "the proceeds" if o["sell"] else "cash on hand"
              print(f"{step}. Buy **{tgt}** with {src}")
              step += 1
          if o["keep"]:
              print(f"{step}. Keep **{', '.join(o['keep'])}** as is")
          print("\n## Why\n")
          print("| leg | value | threshold |")
          print("|---|---|---|")
          print(f"| NDX vs {P['ma_length']}d MA | {legs['ma']['dist_pct']:+.2f}% "
                f"| up >+{P['up_band']*100:.0f}% / down <-{P['down_band']*100:.0f}% |")
          print(f"| VIX {P['vix_ma_length']}d avg | {legs['vix']['value']:.2f} "
                f"| de-gear >= {P['vix_hot']} / cash >= {P['vix_panic']} |")
          print(f"| 52w drawdown | {legs['dd']['value']:.2f}% "
                f"| trigger {P['dd_trigger']*100:.0f}% |")
          print("\nClose this issue once the rebalance is actually placed. "
                "An open issue means a trade you have not executed yet.")
          print("\n<sub>Not investment advice. Auto-generated.</sub>")
          PY
          gh issue create \
            --title "Rebalance: ${{ steps.signal.outputs.summary }}" \
            --body-file /tmp/body.md \
            --label rebalance
          # Close superseded alerts so the open set always means "not yet done".
          for n in $(gh issue list --label rebalance --state open \
                       --json number --jq '.[].number' | tail -n +2); do
            gh issue close "$n" --comment "Superseded by a newer signal."
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
