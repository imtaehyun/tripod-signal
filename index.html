<head>
<meta charset="utf-8">

<title>트라이팟 시그널</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📐</text></svg>">

<body class="bg-slate-950 text-slate-200 antialiased">

<div id="app" class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
  <p class="text-sm text-slate-500">불러오는 중…</p>
</div>

<template id="tpl">
<!-- ── header ─────────────────────────────────────────────── -->
<header class="mb-6 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
  <h1 class="text-lg font-semibold tracking-tight text-slate-100">
    트라이팟 시그널 <span class="ml-1 text-sm font-normal text-slate-500">Tripod</span>
  </h1>
  <p class="tnum text-xs text-slate-500" data-slot="stamp"></p>
</header>

<!-- ── today card ─────────────────────────────────────────── -->
<section class="mb-4 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60">
  <div class="h-1 w-full" data-slot="gearbar"></div>
  <div class="grid gap-6 p-5 sm:grid-cols-[minmax(0,1fr)_auto] sm:p-7">
    <div class="min-w-0">
      <p class="mb-2 text-xs font-medium uppercase tracking-widest" data-slot="verdict-kicker"></p>
      <p class="mb-3 text-2xl font-bold leading-tight text-slate-50 sm:text-3xl" data-slot="verdict"></p>
      <p class="text-sm leading-relaxed text-slate-400" data-slot="verdict-sub"></p>
    </div>
    <div class="min-w-0 sm:text-right">
      <p class="mb-1 text-xs uppercase tracking-widest text-slate-500">목표 배분</p>
      <p class="mb-1 text-xl font-bold tnum" data-slot="alloc"></p>
      <p class="tnum text-sm text-slate-400" data-slot="lev"></p>
      <p class="mt-3 inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-medium"
         data-slot="regime-chip"></p>
    </div>
  </div>
</section>

<!-- ── tripod legs ────────────────────────────────────────── -->
<p class="mb-2 px-1 text-xs uppercase tracking-widest text-slate-500">
  트라이팟 — 다리 하나가 빠지면 넘어진다
</p>
<section class="mb-6 grid gap-3 sm:grid-cols-3" data-slot="legs"></section>

<!-- ── chart ──────────────────────────────────────────────── -->
<section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-4 sm:p-5">
  <div class="mb-3 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
    <h2 class="text-sm font-semibold text-slate-200">기어 타임라인 <span class="font-normal text-slate-500">최근 3년</span></h2>
    <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-400" data-slot="legend"></div>
  </div>
  <div class="relative h-56 w-full overflow-hidden sm:h-72" data-slot="chart"></div>
  <div class="relative mt-1 h-4 w-full" data-slot="xaxis"></div>
  <p class="mt-1 text-xs text-slate-500">
    배경색 = 그날의 기어 · 흰 선 = 나스닥100 종가(로그 스케일) · 점선 = 250일 이동평균
  </p>
</section>

<!-- ── events ─────────────────────────────────────────────── -->
<section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-4 sm:p-5">
  <h2 class="mb-1 text-sm font-semibold text-slate-200">최근 기어 변경</h2>
  <p class="mb-3 text-xs text-slate-500">판정일 종가 기준 → 체결은 다음 거래일</p>
  <div class="-mx-1 overflow-x-auto">
    <table class="w-full min-w-[26rem] border-collapse text-sm">
      <thead>
        <tr class="border-b border-slate-800 text-left text-xs uppercase tracking-wider text-slate-500">
          <th class="py-2 pr-3 font-medium">판정일</th>
          <th class="py-2 pr-3 font-medium">체결일</th>
          <th class="py-2 pr-3 font-medium">변경</th>
          <th class="py-2 pr-1 font-medium">방향</th>
        </tr>
      </thead>
      <tbody data-slot="events"></tbody>
    </table>
  </div>
</section>

<!-- ── validation ─────────────────────────────────────────── -->
<section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-4 sm:p-5">
  <h2 class="mb-1 text-sm font-semibold text-slate-200">재현 검증</h2>
  <p class="mb-3 text-xs leading-relaxed text-slate-500">
    이 구현이 원 영상의 수치를 재현하는지 대조한 것. 파라미터 추론이 맞았는지를 판단하는 근거.
  </p>
  <div class="-mx-1 overflow-x-auto">
    <table class="w-full min-w-[30rem] border-collapse text-sm">
      <thead>
        <tr class="border-b border-slate-800 text-left text-xs uppercase tracking-wider text-slate-500">
          <th class="py-2 pr-3 font-medium">지표</th>
          <th class="py-2 pr-3 font-medium">영상</th>
          <th class="py-2 pr-3 font-medium">이 구현</th>
          <th class="py-2 pr-1 font-medium"></th>
        </tr>
      </thead>
      <tbody data-slot="validation"></tbody>
    </table>
  </div>
</section>

<!-- ── params + disclaimer ────────────────────────────────── -->
<section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/40 p-4 sm:p-5">
  <h2 class="mb-3 text-sm font-semibold text-slate-200">파라미터</h2>
  <dl class="grid gap-x-6 gap-y-2 text-sm sm:grid-cols-2" data-slot="params"></dl>
  <p class="mt-4 border-t border-slate-800 pt-3 text-xs leading-relaxed text-slate-500">
    <span class="font-semibold text-amber-500/90">†</span>
    표시된 항목은 원 영상이 명시하지 않아 <strong class="text-slate-400">추론으로 확정한 값</strong>이다.
    52주 낙폭을 장중 고점 기준으로 바꾸면 낙폭이 더 크게 잡혀 감속이 잦아진다.
    VIX 문턱 28은 원 저자 본인이 “최적값이 아니라 내가 감당하기로 정한 위험의 크기”라고 밝힌 튜닝 지점이다.
  </p>
</section>

<footer class="space-y-2 border-t border-slate-800 pt-5 text-xs leading-relaxed text-slate-500">
  <p>
    <strong class="text-slate-400">투자 권유가 아니다.</strong>
    개인 기록·자동 계산용 도구이며, 규칙의 출처는
    <a class="text-slate-400 underline decoration-slate-700 underline-offset-2 hover:text-slate-200"
       href="https://www.youtube.com/watch?v=lLdRKcBSKDM" target="_blank" rel="noopener">
      송팀장 채널 영상(2026-09-01)</a>이다.
    이 저장소는 그 규칙을 공개 데이터로 재구현한 것일 뿐 원 저자와 무관하다.
  </p>
  <p>
    데이터: 나스닥100 종가(Yahoo Finance), VIX 종가(CBOE 공식).
    레버리지 ETF의 차입비용·경비율은 <strong class="text-slate-400">모델링하지 않았다</strong> — 이 페이지는 수익률을 계산하지 않는다.
    과거는 미래를 보장하지 않는다.
  </p>
</footer>
</template>

<script type="module">
const $ = (root, slot) => root.querySelector(`[data-slot="${slot}"]`);
const fmt = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 2 });
const pct = (v, digits = 2) => `${v > 0 ? '+' : ''}${v.toFixed(digits)}%`;

const app = document.getElementById('app');

function fail(message) {
  app.innerHTML = `<div class="rounded-2xl border border-rose-900/60 bg-rose-950/30 p-5">
    <p class="mb-1 text-sm font-semibold text-rose-300">시그널을 불러올 수 없다</p>
    <p class="text-xs text-rose-200/70">${message}</p></div>`;
}

/* ── SVG timeline: gear bands + log-scale close + MA ─────────────
   The SVG stretches to the container with preserveAspectRatio="none" so the
   chart is legibly tall on a phone; strokes are non-scaling and every label is
   HTML positioned in percent, so nothing gets distorted by the stretch. */
function chart(series, gears) {
  const W = 1000, H = 300;
  const pts = series.filter(r => r.c && r.ma);
  if (pts.length < 2) return null;

  const all = pts.flatMap(r => [r.c, r.ma]);
  const lo = Math.log(Math.min(...all) * 0.97);
  const hi = Math.log(Math.max(...all) * 1.03);
  const x = i => (i / (pts.length - 1)) * W;
  const y = v => (1 - (Math.log(v) - lo) / (hi - lo)) * H;
  const yPct = v => (1 - (Math.log(v) - lo) / (hi - lo)) * 100;

  // Collapse consecutive same-gear sessions into one background rect.
  const bands = [];
  pts.forEach((r, i) => {
    const prev = bands[bands.length - 1];
    if (prev && prev.g === r.g) prev.end = i;
    else bands.push({ g: r.g, start: i, end: i });
  });

  // 3x is the resting state (~70% of all sessions). Washing it at full strength
  // buries the rarer gears, which are the ones worth spotting — so the default
  // gear is drawn faint and the exceptions are drawn strong.
  const OPACITY = { G3: 0.10, G15_UP: 0.34, G15_DOWN: 0.34, CASH: 0.34 };
  const rects = bands.map(b => {
    const x0 = x(b.start);
    const x1 = b.end === pts.length - 1 ? x(b.end) : x(b.end + 1);
    return `<rect x="${x0.toFixed(1)}" y="0" width="${Math.max(0.7, x1 - x0).toFixed(1)}"
      height="${H}" fill="${gears[b.g].color}" opacity="${OPACITY[b.g]}"/>`;
  }).join('');

  const path = key => 'M' + pts.map((r, i) => `${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join('L');

  // Y gridlines at round index levels inside the visible range.
  const yTicks = [];
  const rawLo = Math.exp(lo), rawHi = Math.exp(hi);
  const step = Math.pow(10, Math.floor(Math.log10(rawHi - rawLo))) * (rawHi / rawLo > 2 ? 1 : 0.5);
  for (let v = Math.ceil(rawLo / step) * step; v < rawHi; v += step) {
    yTicks.push({ v, pct: yPct(v) });
  }

  // One gridline per calendar-year boundary.
  const xTicks = [];
  let lastYear = pts[0].d.slice(0, 4);
  pts.forEach((r, i) => {
    const yr = r.d.slice(0, 4);
    if (yr !== lastYear) { xTicks.push({ text: yr, pct: (x(i) / W) * 100 }); lastYear = yr; }
  });

  const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
    class="absolute inset-0 h-full w-full" role="img" aria-label="최근 3년 기어 타임라인">
    ${rects}
    ${yTicks.map(t => `<line x1="0" y1="${y(t.v).toFixed(1)}" x2="${W}" y2="${y(t.v).toFixed(1)}"
        stroke="#64748b" stroke-width="1" opacity="0.25" vector-effect="non-scaling-stroke"/>`).join('')}
    ${xTicks.map(t => `<line x1="${(t.pct * W / 100).toFixed(1)}" y1="0"
        x2="${(t.pct * W / 100).toFixed(1)}" y2="${H}" stroke="#94a3b8" stroke-width="1"
        stroke-dasharray="3 5" opacity="0.45" vector-effect="non-scaling-stroke"/>`).join('')}
    <path d="${path('ma')}" fill="none" stroke="#94a3b8" stroke-width="1.5"
      stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
    <path d="${path('c')}" fill="none" stroke="#f8fafc" stroke-width="1.75"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>` +
    yTicks.map(t => `<span class="tnum pointer-events-none absolute left-1 -translate-y-1/2
      bg-slate-900/70 px-1 text-[0.65rem] text-slate-500"
      style="top:${t.pct.toFixed(2)}%">${fmt.format(Math.round(t.v))}</span>`).join('');

  const axis = xTicks.map(t => `<span class="tnum absolute -translate-x-1/2 text-[0.65rem] text-slate-500"
    style="left:${t.pct.toFixed(2)}%">${t.text}</span>`).join('');

  return { svg, axis };
}

/* ── one tripod leg card with a threshold gauge ──────────────── */
function leg({ title, why, value, unit, lo, hi, marks, cursor, ok, note }) {
  const at = v => `${(100 * (v - lo) / (hi - lo)).toFixed(2)}%`;
  const marker = m => `
    <div class="absolute top-0 h-full w-px" style="left:${at(m.v)};background:${m.color}">
      <span class="absolute -top-0.5 left-1/2 h-2 w-2 -translate-x-1/2 rounded-full"
        style="background:${m.color}"></span>
    </div>`;
  return `<div class="min-w-0 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
    <div class="mb-0.5 flex items-baseline justify-between gap-2">
      <h3 class="truncate text-xs font-semibold uppercase tracking-wider text-slate-400">${title}</h3>
      <span class="shrink-0 text-xs ${ok ? 'text-emerald-400' : 'text-amber-400'}">${ok ? '통과' : '작동'}</span>
    </div>
    <p class="mb-2 truncate text-[0.7rem] text-slate-500">${why}</p>
    <p class="tnum mb-3 text-2xl font-bold text-slate-50">${value}<span
      class="ml-0.5 text-sm font-normal text-slate-500">${unit}</span></p>
    <div class="relative mb-2 h-1.5 w-full rounded-full bg-slate-800">
      ${marks.map(marker).join('')}
      <div class="absolute -top-1 h-3.5 w-1 -translate-x-1/2 rounded-full bg-slate-100"
        style="left:${at(cursor)}"></div>
    </div>
    <p class="tnum text-xs leading-relaxed text-slate-400">${note}</p>
  </div>`;
}

/* ── render ─────────────────────────────────────────────────── */
function render(d) {
  const node = document.getElementById('tpl').content.cloneNode(true);
  const L = d.latest, P = d.params, G = d.gears, S = d.stats;
  const gear = G[L.gear];

  $(node, 'stamp').textContent =
    `판정 ${L.date} 종가 · 갱신 ${d.generated_at.slice(0, 16).replace('T', ' ')}Z`;
  $(node, 'gearbar').style.background = gear.color;

  const acted = L.action_required;
  $(node, 'verdict-kicker').textContent = acted ? '리밸런싱 필요' : '오늘 할 일';
  $(node, 'verdict-kicker').style.color = acted ? gear.color : '#64748b';
  $(node, 'verdict').textContent = acted ? '기어를 변경한다' : '아무것도 하지 않는다';
  $(node, 'verdict-sub').innerHTML = acted
    ? `직전 <strong class="text-slate-300">${G[L.prev_gear].label}</strong> →
       <strong style="color:${gear.color}">${gear.label}</strong>.
       규칙상 <strong class="text-slate-300">다음 거래일</strong>에 체결한다.`
    : `<strong class="text-slate-300">${L.days_since_change}일</strong>째
       (${L.sessions_since_change} 거래일) 변경 없음.
       이 규칙은 연평균 ${S.changes_per_year}회만 움직이고, 최장 ${S.longest_no_change_days}일 손대지 않은 구간도 있었다.`;

  $(node, 'alloc').textContent = gear.label;
  $(node, 'alloc').style.color = gear.color;
  $(node, 'lev').textContent = `계좌 배수 ${gear.leverage}x`;

  const chip = $(node, 'regime-chip');
  chip.textContent = gear.ko;
  chip.style.color = gear.color;
  chip.style.borderColor = gear.color + '66';
  chip.style.background = gear.color + '14';

  /* legs */
  const ma = L.legs.ma, vx = L.legs.vix, dd = L.legs.dd;
  $(node, 'legs').innerHTML = [
    leg({
      title: `250일선 · 방향`, why: '추세가 살아 있는가',
      value: pct(ma.dist_pct), unit: '', lo: -0.15, hi: 0.15,
      cursor: ma.dist_pct / 100,
      marks: [{ v: P.up_band, color: '#dc2626' }, { v: -P.down_band, color: '#0ea5e9' }],
      ok: L.regime === 'up',
      note: `종가 ${fmt.format(L.close)} · MA ${fmt.format(ma.value)}<br>
             전환까지 상승선 ${pct(ma.to_up_pct)} · 하락선 ${pct(ma.to_down_pct)}`,
    }),
    leg({
      title: `VIX ${P.vix_ma_length}일 평균 · 공포`, why: '지금 얼마나 무서워하는가',
      value: fmt.format(vx.value), unit: '', lo: 8, hi: 45, cursor: vx.value,
      marks: [{ v: P.vix_panic, color: '#0ea5e9' }, { v: P.vix_hot, color: '#dc2626' }],
      ok: L.regime === 'up' ? vx.value < P.vix_hot : vx.value < P.vix_panic,
      note: `28(감속)까지 ${vx.to_hot > 0 ? '+' : ''}${vx.to_hot} ·
             18(현금 문턱)까지 ${vx.to_panic > 0 ? '+' : ''}${vx.to_panic}`,
    }),
    leg({
      title: '52주 낙폭 · 피로도', why: '고점에서 얼마나 멀어졌는가',
      value: dd.value.toFixed(2), unit: '%', lo: -0.25, hi: 0, cursor: dd.value / 100,
      marks: [{ v: P.dd_trigger, color: '#dc2626' }],
      ok: dd.value / 100 >= P.dd_trigger,
      note: `52주 종가 고점 ${fmt.format(dd.peak)}<br>
             ${dd.trigger}% 트리거까지 ${dd.to_trigger_pp.toFixed(2)}%p`,
    }),
  ].join('');

  /* chart + legend */
  const c = chart(d.series, G);
  if (c) {
    $(node, 'chart').innerHTML = c.svg;
    $(node, 'xaxis').innerHTML = c.axis;
  }
  $(node, 'legend').innerHTML = Object.entries(G).map(([k, g]) =>
    `<span class="inline-flex items-center gap-1.5 whitespace-nowrap">
       <span class="h-2.5 w-2.5 rounded-sm" style="background:${g.color}"></span>
       ${g.ko}<span class="tnum text-slate-600">${S.occupancy_pct[k] ?? 0}%</span>
     </span>`).join('');

  /* events */
  $(node, 'events').innerHTML = d.events.filter(e => e.from).slice(-12).reverse().map(e => {
    const up = G[e.to].leverage > G[e.from].leverage;
    const same = G[e.to].leverage === G[e.from].leverage;
    const arrow = same ? '→ 유지' : up ? '↑ 증속' : '↓ 감속';
    const tone = same ? 'text-slate-400' : up ? 'text-emerald-400' : 'text-amber-400';
    return `<tr class="border-b border-slate-800/60 last:border-0">
      <td class="tnum py-2 pr-3 text-slate-400">${e.date}</td>
      <td class="tnum py-2 pr-3 text-slate-300">${e.exec_date ?? '—'}</td>
      <td class="py-2 pr-3">
        <span style="color:${G[e.from].color}">${G[e.from].leverage}x</span>
        <span class="text-slate-600">→</span>
        <span class="font-semibold" style="color:${G[e.to].color}">${G[e.to].leverage}x</span>
        <span class="ml-1 text-xs text-slate-500">${G[e.to].label}</span>
      </td>
      <td class="py-2 pr-1 whitespace-nowrap text-xs ${tone}">${arrow}</td>
    </tr>`;
  }).join('');

  /* validation */
  const rows = [
    ['백테스트 기간', '35년', `${S.span_years}년`, true],
    ['연평균 매매 횟수', '8.1회', `${S.changes_per_year}회`, true],
    ['매매 간격 중앙값', '6일', `${S.median_gap_days}일`, true],
    ['무매매 연도 수', '5년', `${S.zero_trade_years.length}년 (${S.zero_trade_years.join(', ')})`, true],
    ['최장 무매매 기간', '2년 7개월', `${S.longest_no_change_days}일`, true],
    ['감속·현금화 횟수', '55회', `${S.downshifts}회`, false],
  ];
  $(node, 'validation').innerHTML = rows.map(([k, a, b, match]) =>
    `<tr class="border-b border-slate-800/60 last:border-0">
      <td class="py-2 pr-3 text-slate-400">${k}</td>
      <td class="tnum py-2 pr-3 text-slate-500">${a}</td>
      <td class="tnum py-2 pr-3 font-medium text-slate-200">${b}</td>
      <td class="py-2 pr-1 text-xs ${match ? 'text-emerald-400' : 'text-amber-400'}">
        ${match ? '일치' : '불일치'}</td>
    </tr>`).join('') +
    `<tr><td colspan="4" class="pt-3 text-xs leading-relaxed text-slate-500">
      감속 횟수만 불일치한다. 3배를 벗어난 구간은 총 ${S.gear_changes}회 전환 중 127개 에피소드로,
      그중 4일 이상 지속된 것이 약 55개다. 원 영상이 짧은 되돌림을 어떻게 병합했는지 밝히지 않아 미해결로 둔다.
      나머지 5개 지표가 모두 일치하므로 파라미터 추론 자체는 맞다고 본다.
    </td></tr>`;

  /* params */
  const dash = (label, value, inferred) =>
    `<div class="flex min-w-0 items-baseline justify-between gap-3 border-b border-slate-800/60 pb-1.5">
      <dt class="truncate text-slate-400">${label}${inferred ? '<span class="text-amber-500/90"> †</span>' : ''}</dt>
      <dd class="tnum shrink-0 font-medium text-slate-200">${value}</dd></div>`;
  $(node, 'params').innerHTML = [
    dash('기준 지수', '^NDX (나스닥100)', true),
    dash('이동평균', `${P.ma_length}일 ${P.ma_kind.toUpperCase()}`, true),
    dash('상승 밴드', `MA +${(P.up_band * 100).toFixed(0)}%`, false),
    dash('하락 밴드', `MA −${(P.down_band * 100).toFixed(0)}%`, false),
    dash('중립 구간', '직전 상태 유지', false),
    dash('VIX 평균', `${P.vix_ma_length}일 SMA`, false),
    dash('VIX 감속 문턱', `${P.vix_hot}`, false),
    dash('VIX 현금 문턱', `${P.vix_panic}`, false),
    dash('52주 낙폭 기준', `${P.dd_lookback}거래일 · ${P.dd_basis === 'close' ? '종가' : '장중'} 고점`, true),
    dash('낙폭 트리거', `${(P.dd_trigger * 100).toFixed(0)}%`, false),
    dash('체결', '판정 다음 거래일', false),
    dash('VIX 결측 보정', `${S.vix_filled_sessions}거래일 전일값 사용`, false),
  ].join('');

  app.replaceChildren(node);
}

fetch(`data/signal.json?v=${Date.now()}`)
  .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
  .then(render)
  .catch(e => fail(`data/signal.json — ${e.message}`));
</script>
</body>
</html>
