<script type="module">
const $ = (root, slot) => root.querySelector(`[data-slot="${slot}"]`);
const fmt = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 2 });
const pct = (v, digits = 2) => `${v > 0 ? '+' : ''}${v.toFixed(digits)}%`;

/* Korean particle 로/으로: 로 after a vowel-final syllable or a ㄹ coda,
   으로 otherwise. "1.5배로" but "현금으로". */
const ro = word => {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  if (code < 0 || code > 11171) return '로';
  const coda = code % 28;
  return (coda === 0 || coda === 8) ? '로' : '으로';
};

const app = document.getElementById('app');

function fail(message) {
  app.innerHTML = `<div class="rounded-2xl border border-rose-900/60 bg-rose-950/30 p-5">
    <p class="mb-1 text-sm font-semibold text-rose-300">시그널을 불러올 수 없다</p>
    <p class="text-xs text-rose-200/70">${message}</p></div>`;
}

/* ── shared chart scaffolding ─────────────────────────────────────
   The SVG stretches to the container with preserveAspectRatio="none" so the
   chart is legibly tall on a phone; strokes are non-scaling and every label is
   HTML positioned in percent, so nothing gets distorted by the stretch.

   `priceRatio` reserves the bottom of the plot for a second panel: Tripod uses
   the whole height, Vol Target gives the lower quarter to its weight track. */
function scaffold(pts, priceRatio = 1) {
  const W = 1000, H = 300;
  const PH = H * priceRatio;
  const all = pts.flatMap(r => [r.c, r.ma250 ?? r.ma]).filter(Boolean);
  const lo = Math.log(Math.min(...all) * 0.97);
  const hi = Math.log(Math.max(...all) * 1.03);
  const x = i => (i / (pts.length - 1)) * W;
  const y = v => (1 - (Math.log(v) - lo) / (hi - lo)) * PH;
  const yPct = v => ((1 - (Math.log(v) - lo) / (hi - lo)) * PH / H) * 100;

  const yTicks = [];
  const rawLo = Math.exp(lo), rawHi = Math.exp(hi);
  const step = Math.pow(10, Math.floor(Math.log10(rawHi - rawLo))) * (rawHi / rawLo > 2 ? 1 : 0.5);
  for (let v = Math.ceil(rawLo / step) * step; v < rawHi; v += step) yTicks.push({ v, pct: yPct(v) });

  const xTicks = [];
  let lastYear = pts[0].d.slice(0, 4);
  pts.forEach((r, i) => {
    const yr = r.d.slice(0, 4);
    if (yr !== lastYear) { xTicks.push({ text: yr, pct: (x(i) / W) * 100 }); lastYear = yr; }
  });

  return { W, H, PH, x, y, yTicks, xTicks };
}

const yLabels = (s, ticks) => ticks.map(t =>
  `<span class="tnum pointer-events-none absolute left-1 -translate-y-1/2 bg-slate-900/70 px-1
     text-[0.65rem] text-slate-500" style="top:${t.pct.toFixed(2)}%">${fmt.format(Math.round(t.v))}</span>`).join('');

const xLabels = ticks => ticks.map(t =>
  `<span class="tnum absolute -translate-x-1/2 text-[0.65rem] text-slate-500"
     style="left:${t.pct.toFixed(2)}%">${t.text}</span>`).join('');

const grid = (s, ticks, xt) =>
  ticks.map(t => `<line x1="0" y1="${s.y(t.v).toFixed(1)}" x2="${s.W}" y2="${s.y(t.v).toFixed(1)}"
      stroke="#64748b" stroke-width="1" opacity="0.25" vector-effect="non-scaling-stroke"/>`).join('') +
  xt.map(t => `<line x1="${(t.pct * s.W / 100).toFixed(1)}" y1="0"
      x2="${(t.pct * s.W / 100).toFixed(1)}" y2="${s.H}" stroke="#94a3b8" stroke-width="1"
      stroke-dasharray="3 5" opacity="0.45" vector-effect="non-scaling-stroke"/>`).join('');

/* ── tripod chart: gear bands behind price ───────────────────────── */
function tripodChart(series, gears) {
  const pts = series.filter(r => r.c && r.ma);
  if (pts.length < 2) return null;
  const s = scaffold(pts, 1);

  // Collapse consecutive same-gear sessions into one background rect.
  const bands = [];
  pts.forEach((r, i) => {
    const prev = bands[bands.length - 1];
    if (prev && prev.g === r.g) prev.end = i;
    else bands.push({ g: r.g, start: i, end: i });
  });

  // 3x is the resting state (~70% of all sessions). Washing it at full strength
  // buries the rarer gears, which are the ones worth spotting — so the default
  // gear is drawn faint and the exceptions are drawn strong.
  const OPACITY = { G3: 0.10, G15_UP: 0.34, G15_DOWN: 0.34, CASH: 0.34 };
  const rects = bands.map(b => {
    const x0 = s.x(b.start);
    const x1 = b.end === pts.length - 1 ? s.x(b.end) : s.x(b.end + 1);
    return `<rect x="${x0.toFixed(1)}" y="0" width="${Math.max(0.7, x1 - x0).toFixed(1)}"
      height="${s.H}" fill="${gears[b.g].color}" opacity="${OPACITY[b.g]}"/>`;
  }).join('');

  const path = key => 'M' + pts.map((r, i) => `${s.x(i).toFixed(1)},${s.y(r[key]).toFixed(1)}`).join('L');

  const svg = `<svg viewBox="0 0 ${s.W} ${s.H}" preserveAspectRatio="none"
    class="absolute inset-0 h-full w-full" role="img" aria-label="최근 3년 기어 타임라인">
    ${rects}${grid(s, s.yTicks, s.xTicks)}
    <path d="${path('ma')}" fill="none" stroke="#94a3b8" stroke-width="1.5"
      stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
    <path d="${path('c')}" fill="none" stroke="#f8fafc" stroke-width="1.75"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>` + yLabels(s, s.yTicks);

  return { svg, axis: xLabels(s.xTicks) };
}

/* ── vol target chart: price on top, weight step-area below ──────── */
function weightChart(series, bands) {
  const pts = series.filter(r => r.c && r.w !== null && r.w !== undefined)
    .map(r => ({ ...r, ma250: r.ma?.['250'] }));
  if (pts.length < 2) return null;
  const s = scaffold(pts, 0.68);
  const TOP = s.PH + 20;                 // where the weight panel starts
  const BH = s.H - TOP;                  // its height
  const wy = w => TOP + (1 - w) * BH;

  // Weight is a step function — it holds until the deadband releases — so it is
  // drawn as steps, not interpolated. Interpolating would imply daily drift the
  // rule does not actually ask for.
  let d = `M${s.x(0).toFixed(1)},${wy(pts[0].w).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    d += `L${s.x(i).toFixed(1)},${wy(pts[i - 1].w).toFixed(1)}`;
    d += `L${s.x(i).toFixed(1)},${wy(pts[i].w).toFixed(1)}`;
  }
  const area = `${d}L${s.x(pts.length - 1).toFixed(1)},${(TOP + BH).toFixed(1)}L${s.x(0).toFixed(1)},${(TOP + BH).toFixed(1)}Z`;

  const path = key => 'M' + pts.map((r, i) => `${s.x(i).toFixed(1)},${s.y(r[key]).toFixed(1)}`).join('L');
  const hasMa = pts.every(p => p.ma250);

  const gl = [0.5, 1].map(w =>
    `<line x1="0" y1="${wy(w).toFixed(1)}" x2="${s.W}" y2="${wy(w).toFixed(1)}" stroke="#64748b"
       stroke-width="1" opacity="0.3" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>`).join('');

  const svg = `<svg viewBox="0 0 ${s.W} ${s.H}" preserveAspectRatio="none"
    class="absolute inset-0 h-full w-full" role="img" aria-label="최근 3년 목표 비중 타임라인">
    ${grid(s, s.yTicks, s.xTicks)}
    ${hasMa ? `<path d="${path('ma250')}" fill="none" stroke="#94a3b8" stroke-width="1.5"
      stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>` : ''}
    <path d="${path('c')}" fill="none" stroke="#f8fafc" stroke-width="1.75"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${gl}
    <path d="${area}" fill="#dc2626" opacity="0.22"/>
    <path d="${d}" fill="none" stroke="#dc2626" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>` + yLabels(s, s.yTicks) +
    [0, 0.5, 1].map(w => `<span class="tnum pointer-events-none absolute left-1 -translate-y-1/2
      bg-slate-900/70 px-1 text-[0.65rem] text-slate-500"
      style="top:${(wy(w) / s.H * 100).toFixed(2)}%">${(w * 100).toFixed(0)}%</span>`).join('');

  return { svg, axis: xLabels(s.xTicks) };
}

/* ── one gauge card, shared by both tabs ─────────────────────────── */
function gauge({ title, why, value, unit, lo, hi, marks, cursor, ok, okLabel, badLabel, note }) {
  const at = v => `${Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo))).toFixed(2)}%`;
  const marker = m => `
    <div class="absolute top-0 h-full w-px" style="left:${at(m.v)};background:${m.color}">
      <span class="absolute -top-0.5 left-1/2 h-2 w-2 -translate-x-1/2 rounded-full"
        style="background:${m.color}"></span>
    </div>`;
  return `<div class="min-w-0 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
    <div class="mb-0.5 flex items-baseline justify-between gap-2">
      <h3 class="truncate text-xs font-semibold uppercase tracking-wider text-slate-400">${title}</h3>
      <span class="shrink-0 text-xs ${ok ? 'text-emerald-400' : 'text-amber-400'}">${ok ? (okLabel ?? '통과') : (badLabel ?? '작동')}</span>
    </div>
    <p class="mb-2 truncate text-[0.7rem] text-slate-500">${why}</p>
    <p class="tnum mb-3 text-2xl font-bold text-slate-50">${value}<span
      class="ml-0.5 text-sm font-normal text-slate-500">${unit}</span></p>
    <div class="relative mb-2 h-1.5 w-full rounded-full bg-slate-800">
      ${marks.map(marker).join('')}
      <div class="absolute -top-1 h-3.5 w-1 -translate-x-1/2 rounded-full bg-slate-100"
        style="left:${at(cursor)}"></div>
    </div>
    <p class="tnum text-xs leading-relaxed text-slate-400">${note}</p>
  </div>`;
}

const dash = (label, value, inferred) =>
  `<div class="flex min-w-0 items-baseline justify-between gap-3 border-b border-slate-800/60 pb-1.5">
    <dt class="truncate text-slate-400">${label}${inferred ? '<span class="text-amber-500/90"> †</span>' : ''}</dt>
    <dd class="tnum shrink-0 font-medium text-slate-200">${value}</dd></div>`;

/* ── tab 1 render ────────────────────────────────────────────────── */
function renderTripod(st) {
  const node = document.getElementById('tpl-tripod').content.cloneNode(true);
  const L = st.latest, P = st.params, G = st.gears, S = st.stats;
  const gear = G[L.gear];

  $(node, 'gearbar').style.background = gear.color;

  /* Three states, not two: a gear key can change while the book does not. */
  const acted = L.action_required;
  const regimeOnly = L.regime_only_change;
  const o = L.orders;
  const order = t => `<span class="tnum font-semibold text-slate-100">${t}</span>`;

  $(node, 'verdict-kicker').textContent =
    acted ? '리밸런싱 필요' : regimeOnly ? '상태만 변경' : '오늘 할 일';
  $(node, 'verdict-kicker').style.color = acted ? gear.color : '#64748b';
  $(node, 'verdict').textContent =
    acted ? '아래 주문을 낸다' : regimeOnly ? '주문 없음 (상태만 바뀜)' : '아무것도 하지 않는다';

  if (acted) {
    $(node, 'verdict-sub').innerHTML = `
      <span class="mb-2 block">
        <strong class="text-slate-300">${G[L.prev_gear].label}</strong> →
        <strong style="color:${gear.color}">${gear.label}</strong> ·
        ${L.provisional && prov && prov.same_session_fill
            ? '<strong class="text-amber-300">오늘 종가</strong>에 지금 체결한다.'
            : '규칙상 <strong class="text-slate-300">다음 거래일</strong>에 체결한다.'}
      </span>
      <span class="block space-y-1">
        ${o.sell.length ? `<span class="block">1. ${o.sell.map(order).join(', ')} <strong class="text-amber-400">전량 매도</strong></span>` : ''}
        ${o.buy.length ? `<span class="block">${o.sell.length ? '2. 대금으로' : '1. 보유 현금으로'}
          ${o.buy.map(t => `${order(t)} ${(gear.weights[t] * 100).toFixed(0)}%`).join(' + ')}
          <strong class="text-emerald-400">매수</strong></span>` : ''}
        ${o.keep.length ? `<span class="block text-slate-500">${o.keep.map(order).join(', ')} 는 그대로 보유</span>` : ''}
      </span>`;
  } else if (regimeOnly) {
    $(node, 'verdict-sub').innerHTML =
      `레짐이 <strong class="text-slate-300">${G[L.prev_gear].ko}</strong> →
       <strong style="color:${gear.color}">${gear.ko}</strong>${ro(gear.ko)} 바뀌었지만
       보유 종목은 <strong class="text-slate-300">${gear.label}</strong>로 동일하다.
       <strong class="text-slate-300">낼 주문이 없다.</strong>
       35년 백테스트에서 ${S.regime_only_changes}회 발생한 경우다.`;
  } else {
    $(node, 'verdict-sub').innerHTML =
      `<strong class="text-slate-300">${L.days_since_change}일</strong>째
       (${L.sessions_since_change} 거래일) 변경 없음.
       이 규칙은 연평균 ${S.changes_per_year}회만 움직이고, 최장 ${S.longest_no_change_days}일 손대지 않은 구간도 있었다.`;
  }

  $(node, 'alloc').textContent = gear.label;
  $(node, 'alloc').style.color = gear.color;
  $(node, 'lev').textContent = `계좌 배수 ${gear.leverage}x`;

  const chip = $(node, 'regime-chip');
  chip.textContent = gear.ko;
  chip.style.color = gear.color;
  chip.style.borderColor = gear.color + '66';
  chip.style.background = gear.color + '14';

  const ma = L.legs.ma, vx = L.legs.vix, dd = L.legs.dd;
  $(node, 'legs').innerHTML = [
    gauge({
      title: `250일선 · 방향`, why: '추세가 살아 있는가',
      value: pct(ma.dist_pct), unit: '', lo: -0.15, hi: 0.15,
      cursor: ma.dist_pct / 100,
      marks: [{ v: P.up_band, color: '#dc2626' }, { v: -P.down_band, color: '#0ea5e9' }],
      ok: L.regime === 'up',
      note: `종가 ${fmt.format(L.close)} · MA ${fmt.format(ma.value)}<br>
             전환까지 상승선 ${pct(ma.to_up_pct)} · 하락선 ${pct(ma.to_down_pct)}`,
    }),
    gauge({
      title: `VIX ${P.vix_ma_length}일 평균 · 공포`, why: '지금 얼마나 무서워하는가',
      value: fmt.format(vx.value), unit: '', lo: 8, hi: 45, cursor: vx.value,
      marks: [{ v: P.vix_panic, color: '#0ea5e9' }, { v: P.vix_hot, color: '#dc2626' }],
      ok: L.regime === 'up' ? vx.value < P.vix_hot : vx.value < P.vix_panic,
      note: `28(감속)까지 ${vx.to_hot > 0 ? '+' : ''}${vx.to_hot} ·
             18(현금 문턱)까지 ${vx.to_panic > 0 ? '+' : ''}${vx.to_panic}`,
    }),
    gauge({
      title: '52주 낙폭 · 피로도', why: '고점에서 얼마나 멀어졌는가',
      value: dd.value.toFixed(2), unit: '%', lo: -0.25, hi: 0, cursor: dd.value / 100,
      marks: [{ v: P.dd_trigger, color: '#dc2626' }],
      ok: dd.value / 100 >= P.dd_trigger,
      note: `52주 종가 고점 ${fmt.format(dd.peak)}<br>
             ${dd.trigger}% 트리거까지 ${dd.to_trigger_pp.toFixed(2)}%p`,
    }),
  ].join('');

  const c = tripodChart(st.series, G);
  if (c) { $(node, 'chart').innerHTML = c.svg; $(node, 'xaxis').innerHTML = c.axis; }
  $(node, 'legend').innerHTML = Object.entries(G).map(([k, g]) =>
    `<span class="inline-flex items-center gap-1.5 whitespace-nowrap">
       <span class="h-2.5 w-2.5 rounded-sm" style="background:${g.color}"></span>
       ${g.ko}<span class="tnum text-slate-600">${S.occupancy_pct[k] ?? 0}%</span>
     </span>`).join('');

  $(node, 'events').innerHTML = st.events.filter(e => e.from).slice(-12).reverse().map(e => {
    const up = G[e.to].leverage > G[e.from].leverage;
    const arrow = !e.trade ? '주문 없음' : up ? '↑ 증속' : '↓ 감속';
    const tone = !e.trade ? 'text-slate-500' : up ? 'text-emerald-400' : 'text-amber-400';
    const what = e.trade
      ? [e.sell.length ? `${e.sell.join('+')} 매도` : '', e.buy.length ? `${e.buy.join('+')} 매수` : '']
          .filter(Boolean).join(' → ')
      : '보유 종목 동일';
    return `<tr class="border-b border-slate-800/60 last:border-0 ${e.trade ? '' : 'opacity-60'}">
      <td class="tnum py-2 pr-3 text-slate-400">${e.date}</td>
      <td class="tnum py-2 pr-3 text-slate-300">${e.exec_date
        ?? '<span class="text-amber-400">다음 거래일</span>'}</td>
      <td class="py-2 pr-3">
        <span style="color:${G[e.from].color}">${G[e.from].leverage}x</span>
        <span class="text-slate-600">→</span>
        <span class="font-semibold" style="color:${G[e.to].color}">${G[e.to].leverage}x</span>
        <span class="ml-1 text-xs text-slate-500">${what}</span>
      </td>
      <td class="py-2 pr-1 whitespace-nowrap text-xs ${tone}">${arrow}</td>
    </tr>`;
  }).join('');

  const rows = [
    ['백테스트 기간', '35년', `${S.span_years}년`, true],
    ['연평균 매매 횟수', '8.1회', `${S.changes_per_year}회`, true],
    ['매매 간격 중앙값', '6일', `${S.median_gap_days}일`, true],
    ['무매매 연도 수', '5년', `${S.zero_trade_years.length}년 (${S.zero_trade_years.join(', ')})`, true],
    ['최장 무매매 기간', '2년 7개월', `${S.longest_no_change_days}일`, true],
    ['감속·현금화 횟수', '55회', `${S.downshifts}회`, false],
  ];
  $(node, 'validation').innerHTML = rows.map(([k, a, b, match]) =>
    `<tr class="border-b border-slate-800/60 last:border-0">
      <td class="py-2 pr-3 text-slate-400">${k}</td>
      <td class="tnum py-2 pr-3 text-slate-500">${a}</td>
      <td class="tnum py-2 pr-3 font-medium text-slate-200">${b}</td>
      <td class="py-2 pr-1 text-xs ${match ? 'text-emerald-400' : 'text-amber-400'}">
        ${match ? '일치' : '불일치'}</td>
    </tr>`).join('') +
    `<tr><td colspan="4" class="pt-3 text-xs leading-relaxed text-slate-500">
      매매 횟수는 <strong class="text-slate-400">실제 주문이 발생한 ${S.trade_events}회</strong> 기준이다.
      기어 키가 바뀐 것만 세면 ${S.gear_changes}회(연 8.07회)인데, 차이인 ${S.regime_only_changes}회는
      1.5배(상승) ↔ 1.5배(하락) 전환으로 <strong class="text-slate-400">보유 종목이 같아 주문이 없다</strong>.
      영상의 8.1회는 어느 쪽으로 세도 근사하므로 원 저자가 이 구분을 했는지는 알 수 없다.
      <br><br>
      감속 횟수만 불일치한다. 3배를 벗어난 구간은 127개 에피소드이고 그중 4일 이상 지속된 것이 약 55개다.
      원 영상이 짧은 되돌림을 어떻게 병합했는지 밝히지 않아 미해결로 둔다.
      나머지 5개 지표가 모두 일치하므로 파라미터 추론 자체는 맞다고 본다.
    </td></tr>`;

  $(node, 'params').innerHTML = [
    dash('기준 지수', '^NDX (나스닥100)', true),
    dash('이동평균', `${P.ma_length}일 ${P.ma_kind.toUpperCase()}`, true),
    dash('상승 밴드', `MA +${(P.up_band * 100).toFixed(0)}%`, false),
    dash('하락 밴드', `MA −${(P.down_band * 100).toFixed(0)}%`, false),
    dash('중립 구간', '직전 상태 유지', false),
    dash('VIX 평균', `${P.vix_ma_length}일 SMA`, false),
    dash('VIX 감속 문턱', `${P.vix_hot}`, false),
    dash('VIX 현금 문턱', `${P.vix_panic}`, false),
    dash('52주 낙폭 기준', `${P.dd_lookback}거래일 · ${P.dd_basis === 'close' ? '종가' : '장중'} 고점`, true),
    dash('낙폭 트리거', `${(P.dd_trigger * 100).toFixed(0)}%`, false),
    dash('체결', '판정 다음 거래일', false),
    dash('VIX 결측 보정', `${S.vix_filled_sessions}거래일 전일값 사용`, false),
  ].join('');

  return node;
}

/* ── tab 2 render ────────────────────────────────────────────────── */
function renderVolTarget(st, tripodStats, root) {
  // `root` is the whole payload: the provisional block is top-level because it
  // describes the RUN (which price, taken when), not one strategy.
  const cashTicker = st.cash_ticker || 'SGOV';
  const prov = (root && root.provisional) || null;
  const node = document.getElementById('tpl-voltarget').content.cloneNode(true);
  const L = st.latest, P = st.params, S = st.stats, I = L.inputs;

  $(node, 'bar').style.background = L.color;

  const acted = L.action_required;
  $(node, 'verdict-kicker').textContent = acted ? '리밸런싱 필요' : '오늘 할 일';
  $(node, 'verdict-kicker').style.color = acted ? L.color : '#64748b';
  $(node, 'verdict').textContent = acted ? '아래 주문을 낸다' : '아무것도 하지 않는다';

  if (acted) {
    const buying = L.side === 'buy';
    $(node, 'verdict-sub').innerHTML = `
      <span class="mb-2 block">
        TQQQ <strong class="text-slate-300">${(L.prev_weight * 100).toFixed(0)}%</strong> →
        <strong style="color:${L.color}">${L.weight_pct.toFixed(0)}%</strong> ·
        ${L.provisional && prov && prov.same_session_fill
            ? '<strong class="text-amber-300">오늘 종가</strong>에 지금 체결한다.'
            : '규칙상 <strong class="text-slate-300">다음 거래일</strong>에 체결한다.'}
      </span>
      <span class="block">
        계좌의 <strong class="tnum ${buying ? 'text-emerald-400' : 'text-amber-400'}">${Math.abs(L.delta_pp).toFixed(0)}%p</strong>
        만큼 <span class="tnum font-semibold text-slate-100">TQQQ</span>
        <strong class="${buying ? 'text-emerald-400' : 'text-amber-400'}">${buying ? '추가 매수' : '매도'}</strong>
        → 최종 <span class="tnum font-semibold text-slate-100">TQQQ ${L.weight_pct.toFixed(0)}% / ${cashTicker} ${L.cash_pct.toFixed(0)}%</span>
      </span>`;
  } else {
    $(node, 'verdict-sub').innerHTML =
      `<strong class="text-slate-300">${L.days_since_change}일</strong>째
       (${L.sessions_since_change} 거래일) 변경 없음.
       원시 목표가 <strong class="tnum text-slate-300">${I.release_down_pct.toFixed(0)}%</strong> 아래나
       <strong class="tnum text-slate-300">${I.release_up_pct.toFixed(0)}%</strong> 위로 가야
       데드밴드가 풀린다. 이 전략은 연평균 ${S.changes_per_year}회 움직인다 —
       트라이팟(${tripodStats.changes_per_year}회)보다 훨씬 자주다.`;
  }

  $(node, 'alloc').textContent = `TQQQ ${L.weight_pct.toFixed(0)}% / ${cashTicker} ${L.cash_pct.toFixed(0)}%`;
  $(node, 'alloc').style.color = L.color;
  $(node, 'lev').textContent = `계좌 배수 ${L.leverage.toFixed(2)}x`;

  // 장중 판정 배지. 15:45 ET 시세로 판정하면 그 종가에 체결할 수 있어 MDD가
  // 배수 1당 8pp 얕아진다(ADR 0005). 확정 종가 판정과 반드시 구분해서 보여준다 —
  // 어떤 가격으로 정해진 신호인지 모르면 언제 체결해야 하는지도 알 수 없다.
  const execNote = $(node, 'exec-note');
  if (execNote) {
    execNote.textContent = (L.provisional && prov && prov.same_session_fill)
      ? '15:45 ET 시세 기준 → 같은 날 종가에 체결'
      : '판정일 종가 기준 → 체결은 다음 거래일';
  }

  const pvNode = $(node, 'provisional');
  if (pvNode) {
    if (L.provisional && prov) {
      const at = (prov.taken_at_et || '').slice(11, 16);
      pvNode.innerHTML = prov.same_session_fill
        ? `<span class="text-amber-300">● 장중 ${at} ET 시세 기준</span> — 지금 시장가로 체결 (MOC 마감 15:50)`
        : `<span class="text-amber-300">● 장중 ${at} ET 시세 기준</span> — 체결 시각을 놓쳤다. 다음 거래일에 체결`;
      pvNode.classList.remove('hidden');
    } else {
      pvNode.innerHTML = `<span class="text-slate-500">● 확정 종가 기준</span> — 다음 거래일 종가에 체결`;
      pvNode.classList.remove('hidden');
    }
  }

  const chip = $(node, 'band-chip');
  chip.textContent = L.band_ko;
  chip.style.color = L.color;
  chip.style.borderColor = L.color + '66';
  chip.style.background = L.color + '14';

  /* three inputs */
  const lens = P.ma_lengths;
  /* The vote counts LATCHED legs, not raw comparisons. Inside the ±1% band a leg
     keeps its old state, so a leg can read "on" while price sits just below its
     MA — mark those so the vote never looks like an arithmetic error. */
  const maList = lens.map(n => {
    const k = String(n);
    const on = I.legs?.[k] ?? I.ma_above[k];
    const carried = I.legs && I.legs[k] !== I.ma_above[k];
    return `${n}일 <span class="${on ? 'text-emerald-400' : 'text-slate-600'}">${on ? '켜짐' : '꺼짐'}</span>` +
           `<span class="text-slate-600">${I.ma_dist_pct ? ` ${pct(I.ma_dist_pct[k], 1)}` : ''}${carried ? '*' : ''}</span>`;
  }).join(' · ');
  const anyCarried = I.legs && lens.some(n => I.legs[String(n)] !== I.ma_above[String(n)]);
  const heldBefore = 100 * L.prev_weight;
  /* The deadband is tested against the SNAPPED target, not the raw number, so
     that is the gap to report. Raw 98.3% snaps to 100%, which is 10pp from a
     held 90% and therefore releases — quoting the raw gap (8pp) would look like
     it fired below its own threshold. */
  const snappedPct = Math.round(I.raw_pct / I.step_pp) * I.step_pp;
  const gapPct = Math.abs(snappedPct - heldBefore);

  $(node, 'inputs').innerHTML = [
    gauge({
      title: '추세 투표 · 방향', why: `${lens.join('/')}일선 중 몇 개가 켜졌나`,
      value: `${I.above}/${I.of}`, unit: '', lo: 0, hi: 1, cursor: I.vote,
      marks: [{ v: 0.5, color: '#f59e0b' }],
      ok: I.vote >= 0.5, okLabel: '추세', badLabel: '약세',
      note: maList + (anyCarried
        ? `<br><span class="text-slate-600">* ±${I.ma_band_pct}% 밴드 안이라 직전 상태 유지</span>` : ''),
    }),
    gauge({
      title: '실현변동성 · 속도', why: `${P.vol_windows.join('·')}일 표준편차 평균`,
      value: I.rvol_pct.toFixed(1), unit: '%', lo: 5, hi: 60, cursor: I.rvol_pct,
      marks: [{ v: 25, color: '#f59e0b' }, { v: 40, color: '#dc2626' }],
      ok: I.rvol_pct < 25, okLabel: '평온', badLabel: '높음',
      note: `높을수록 비중이 줄어든다. 3배 ETF의 변동성 감쇠는<br>−3σ²라서 변동성에 제곱으로 비례한다.`,
    }),
    gauge({
      /* The band is measured against what was held BEFORE today's decision. On
         a day that fires, comparing against the new weight would show a 2pp gap
         and make the trade look unmotivated. */
      title: '데드밴드 · 관성', why: '원시 목표가 보유에서 얼마나 벌어졌나',
      value: I.raw_pct.toFixed(0), unit: '%', lo: 0, hi: 100, cursor: I.raw_pct,
      marks: [{ v: heldBefore, color: '#dc2626' }],
      ok: !acted, okLabel: '유지', badLabel: '해제',
      note: acted
        ? `원시 ${I.raw_pct.toFixed(0)}% → ${I.step_pp}%p 격자 ${snappedPct.toFixed(0)}%,
           보유 ${heldBefore.toFixed(0)}%와 ${gapPct.toFixed(0)}%p 차 —
           <strong class="text-amber-400">${I.band_pp}%p 이상이라 해제</strong>`
        : `흰 눈금 = 원시 목표 ${I.raw_pct.toFixed(0)}% · 붉은 눈금 = 보유 ${heldBefore.toFixed(0)}%<br>
           격자 ${snappedPct.toFixed(0)}%와 ${gapPct.toFixed(0)}%p 차 · ${I.band_pp}%p 넘으면 조정`,
    }),
  ].join('');

  /* the arithmetic, spelled out */
  const chunk = (label, value) =>
    `<div class="flex items-baseline justify-between gap-3 border-b border-slate-800/60 py-1.5">
       <span class="text-slate-400">${label}</span>
       <span class="shrink-0 font-medium text-slate-200">${value}</span></div>`;
  $(node, 'math').innerHTML =
    chunk('추세 투표 (켜진 이동평균 수)', `${I.above} / ${I.of} = ${I.vote.toFixed(2)}`) +
    chunk('목표 변동성 ÷ (3배 × 실현변동성)',
          `${I.target_vol_pct}% ÷ (3 × ${I.rvol_pct.toFixed(1)}%) = ${(I.target_vol_pct / (3 * I.rvol_pct)).toFixed(2)}`) +
    chunk('원시 목표 = 투표 × 위 값', `${I.raw_pct.toFixed(1)}%`) +
    chunk(`${I.step_pp}%p 격자로 반올림`, `${(Math.round(I.raw_pct / I.step_pp) * I.step_pp).toFixed(0)}%`) +
    chunk(`데드밴드(${I.band_pp}%p) 적용 후 <strong class="text-slate-300">실행 비중</strong>`,
          `<strong style="color:${L.color}">TQQQ ${L.weight_pct.toFixed(0)}%</strong>`);

  /* chart */
  const c = weightChart(st.series, null);
  if (c) { $(node, 'chart').innerHTML = c.svg; $(node, 'xaxis').innerHTML = c.axis; }
  $(node, 'legend').innerHTML =
    `<span class="inline-flex items-center gap-1.5 whitespace-nowrap">
       <span class="h-2.5 w-2.5 rounded-sm bg-red-600/40"></span>TQQQ 목표 비중
       <span class="tnum text-slate-600">평균 ${S.avg_weight_pct}%</span></span>
     <span class="inline-flex items-center gap-1.5 whitespace-nowrap">
       <span class="h-2.5 w-2.5 rounded-sm" style="background:#64748b"></span>전량 ${cashTicker}
       <span class="tnum text-slate-600">${S.fully_cash_pct}%</span></span>
     <span class="tnum whitespace-nowrap text-slate-600">평균 배수 ${S.avg_leverage}x</span>`;

  /* events */
  $(node, 'events').innerHTML = st.events.filter(e => e.from !== null).slice(-12).reverse().map(e => {
    const up = e.delta > 0;
    const tone = up ? 'text-emerald-400' : 'text-amber-400';
    return `<tr class="border-b border-slate-800/60 last:border-0">
      <td class="tnum py-2 pr-3 text-slate-400">${e.date}</td>
      <td class="tnum py-2 pr-3 text-slate-300">${e.exec_date
        ?? '<span class="text-amber-400">다음 거래일</span>'}</td>
      <td class="tnum py-2 pr-3">
        <span class="text-slate-500">${(e.from * 100).toFixed(0)}%</span>
        <span class="text-slate-600">→</span>
        <span class="font-semibold text-slate-200">${(e.to * 100).toFixed(0)}%</span>
      </td>
      <td class="tnum py-2 pr-1 whitespace-nowrap text-xs ${tone}">
        ${up ? '↑ 매수' : '↓ 매도'} ${Math.abs(e.delta * 100).toFixed(0)}%p</td>
    </tr>`;
  }).join('');

  /* honest tradeoff against the other tab */
  $(node, 'tradeoff').innerHTML = `
    <p><strong class="text-amber-200/80">손이 훨씬 많이 간다.</strong>
      연 <span class="tnum">${S.changes_per_year}회</span> 움직인다. 트라이팟은
      <span class="tnum">${tripodStats.changes_per_year}회</span>다. 최장 무변경 구간도
      <span class="tnum">${S.longest_no_change_days}일</span> vs
      <span class="tnum">${tripodStats.longest_no_change_days}일</span>이다.
      “매일 볼 이유가 없다”는 트라이팟의 장점이 여기서는 성립하지 않는다.</p>
    <p><strong class="text-amber-200/80">과세계좌에서는 불리하다.</strong>
      회전이 5배 가까이 높아 세금이 성과 우위를 상당 부분 먹는다.
      세금 없는 계좌가 아니면 목표 변동성을 올려 회전을 낮추는 편이 낫다.</p>
    <p><strong class="text-amber-200/80">변동성은 뒤를 본다.</strong>
      ${P.vol_windows.join('·')}일 창이라 급락 <em>이후에</em> 비중을 줄인다.
      1987년·2020년 같은 갭 하락의 첫 방은 그대로 맞는다.</p>
    <p><strong class="text-amber-200/80">히스테리시스는 트라이팟에서 빌려왔다.</strong>
      이동평균 4개 각각에 ±${I.ma_band_pct}% 밴드를 둬 밴드 안에서는 직전 상태를 유지한다.
      이게 없으면 이동평균 하나를 스치는 것만으로 목표가 25%p 움직여 데드밴드를 뚫고,
      50일선 근처에서 하루 만에 45%p를 왕복한다. 넣으면 같은 주 내 반전이 95회 → 9회로 줄고
      낙폭은 오히려 좋아진다. 성과를 위한 손질이 아니라 <em>운용 가능성</em>을 산 것이다.</p>
    <p><strong class="text-amber-200/80">VIX를 쓰지 않는다.</strong>
      그래서 히스토리가 트라이팟보다 4년 길고(<span class="tnum">${S.span_years}년</span> vs
      <span class="tnum">${tripodStats.span_years}년</span>) CBOE 파일에 의존하지 않는다.</p>`;

  $(node, 'params').innerHTML = [
    dash('기준 지수', '^NDX (나스닥100)', false),
    dash('추세 이동평균', `${P.ma_lengths.join(' / ')}일 ${P.ma_kind.toUpperCase()}`, false),
    dash('이동평균 밴드', `±${(P.ma_band * 100).toFixed(0)}% (직전 상태 유지)`, false),
    dash('변동성 창', `${P.vol_windows.join(' / ')}일 표준편차 평균`, false),
    dash('목표 변동성', `${(P.target_vol * 100).toFixed(0)}%`, true),
    dash('대상 ETF 배수', `${P.etf_leverage}x (TQQQ)`, false),
    dash('최대 비중', `${(P.max_weight * 100).toFixed(0)}%`, false),
    dash('비중 격자', `${(P.weight_step * 100).toFixed(0)}%p`, false),
    dash('리밸런싱 밴드', `${(P.rebalance_band * 100).toFixed(0)}%p`, false),
    dash('변동성 하한', `${(P.vol_floor * 100).toFixed(0)}%`, false),
    dash('체결', '판정 다음 거래일', false),
    dash('평균 비중', `${S.avg_weight_pct}% (배수 ${S.avg_leverage}x)`, false),
    dash(`전량 ${cashTicker} 비율`, `${S.fully_cash_pct}% of ${S.sessions}거래일`, false),
  ].join('');

  return node;
}

/* ── shell + routing ─────────────────────────────────────────────── */
const RENDERERS = {
  tripod: d => renderTripod(d.strategies.tripod),
  voltarget: d => renderVolTarget(d.strategies.voltarget, d.strategies.tripod.stats, d),
};

function render(d, key) {
  const nav = d.nav ?? [{ key: 'tripod', ko: '트라이팟' }];
  const active = RENDERERS[key] ? key : nav[0].key;

  const shell = document.getElementById('tpl-shell').content.cloneNode(true);

  const tLast = d.strategies.tripod.latest.date;
  const vLast = d.strategies.voltarget.latest.date;
  const judged = active === 'tripod' ? tLast : vLast;
  $(shell, 'stamp').textContent =
    `판정 ${judged} 종가 · 갱신 ${d.generated_at.slice(0, 16).replace('T', ' ')}Z`;

  /* Nav doubles as the alert surface: a tab whose strategy wants a trade today
     carries a dot, so switching tabs is never how you find out. */
  $(shell, 'nav').innerHTML = nav.map(s => {
    const on = s.key === active;
    const st = d.strategies[s.key];
    const alert = st?.latest?.action_required;
    return `<a href="#${s.key}"
      class="-mb-px flex items-center gap-1.5 border-b-2 px-3 py-2 text-sm transition-colors
             ${on ? 'border-slate-200 font-semibold text-slate-100'
                  : 'border-transparent text-slate-500 hover:border-slate-700 hover:text-slate-300'}"
      ${on ? 'aria-current="page"' : ''}>
      ${s.ko}
      ${alert ? `<span class="h-1.5 w-1.5 rounded-full bg-red-500" title="리밸런싱 필요"></span>` : ''}
    </a>`;
  }).join('');

  $(shell, 'body').replaceChildren(RENDERERS[active](d));
  app.replaceChildren(shell);
}

const currentKey = () => (location.hash || '').replace(/^#/, '');

/* data/signal.js sets window.__SIGNAL__ and works from any origin including
   file://. Over http the fetch path is preferred so a cached signal.js can
   never win over fresh data. */
const embedded = window.__SIGNAL__;
const isFile = location.protocol === 'file:';

function boot(d) {
  render(d, currentKey());
  addEventListener('hashchange', () => render(d, currentKey()));
}

if (isFile) {
  embedded
    ? boot(embedded)
    : fail('data/signal.js 를 찾을 수 없다. <code class="text-slate-300">python scripts/signal.py</code> 를 실행해 생성하라.');
} else {
  fetch(`data/signal.json?v=${Date.now()}`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(boot)
    .catch(e => embedded
      ? boot(embedded)
      : fail(`data/signal.json — ${e.message}`));
}
</script>
