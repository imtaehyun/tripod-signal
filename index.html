<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>나스닥 레버리지 시그널</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📐</text></svg>">
<!-- Fonts and tokens: DESIGN.md. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<!-- Sets window.__SIGNAL__. A script tag is exempt from CORS, so this is the
     path that works when the file is opened directly (file://), where fetch()
     is blocked. Failure here is silent and handled by the fetch fallback. -->
<script src="data/signal.js" onerror="window.__SIGNAL_SCRIPT_FAILED__=1"></script>
<style>
:root {
  --ground: #F5F6F7; --surface: #FFFFFF; --ink: #111418; --muted: #5B6470;
  --line: #DCE0E5; --line-strong: #C3C9D1;
  --buy: #D6293B; --buy-tint: #FBEAEC; --sell: #1F5FD1; --sell-tint: #E8EFFB;
  --warn: #B7791F; --warn-tint: #FBF1E1; --err: #B42318; --err-tint: #FCEBE9;
  --lev-0: #E4E7EB; --lev-15: #8A939E; --lev-3: #2B3138;
  --f-display: 'Wanted Sans Variable', 'Pretendard Variable', sans-serif;
  --f-body: 'Pretendard Variable', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0F1216; --surface: #161A1F; --ink: #E8EBEE; --muted: #98A1AC;
    --line: #262C33; --line-strong: #39414B;
    --buy: #F2636F; --buy-tint: #3A1D22; --sell: #6B98F2; --sell-tint: #18253D;
    --warn: #E0A84A; --warn-tint: #33270F; --err: #F07A6E; --err-tint: #3A1A17;
    --lev-0: #232931; --lev-15: #6B7480; --lev-3: #D5DAE0;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
b, strong { font-weight: 600; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.sm { font-size: 12px; }
.nowrap { white-space: nowrap; }
.buy { color: var(--buy); } .sell { color: var(--sell); }

.page { max-width: 720px; margin: 0 auto; padding: 18px 20px 48px; }
@media (min-width: 640px) { .page { padding: 32px 24px 64px; } }

/* header + tabs */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.name { font-weight: 600; font-size: 15px; }
.stamp { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 20px; margin: 12px 0 16px; border-bottom: 1px solid var(--line); }
.tab { position: relative; padding: 8px 0 10px; font-size: 15px; color: var(--muted); text-decoration: none; }
.tab:hover { color: var(--ink); }
.tab[aria-current] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--ink); }
.tab .dot { position: absolute; top: 8px; right: -9px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.tab:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

/* banners: a broken day must never look like a quiet day */
.banner { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
.banner.warn { background: var(--warn-tint); color: var(--warn); }
.banner.err { background: var(--err-tint); color: var(--err); }

/* ticket: the one container on the page */
.ticket { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 22px 22px 18px; }
.t-meta { font-size: 12px; color: var(--muted); }
.verdict { font: 800 clamp(2.25rem, 1.9rem + 1.5vw, 2.75rem)/1.12 var(--f-display); letter-spacing: -0.025em; margin: 6px 0 14px; }
.book { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.t-sub { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.t-sub b { color: var(--ink); }
.orders { list-style: none; display: grid; gap: 6px; }
.ord { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 11px 12px; border-radius: 6px; font-size: 17px; }
.ord .n { font-size: 13px; color: var(--muted); }
.ord .tk, .ord .sd { font-weight: 700; }
.ord .amt { font-weight: 600; min-width: 52px; text-align: right; }
.ord.buy { background: var(--buy-tint); color: var(--ink); } .ord.buy .sd, .ord.buy .amt { color: var(--buy); }
.ord.sell { background: var(--sell-tint); color: var(--ink); } .ord.sell .sd, .ord.sell .amt { color: var(--sell); }
.keep { margin-top: 8px; font-size: 13px; color: var(--muted); }

/* sections: hairlines, not cards */
.sec { padding-top: 22px; }
.sec + .sec { border-top: 1px solid var(--line); margin-top: 22px; }
.sec h2 { font-size: 18px; font-weight: 600; line-height: 1.3; margin-bottom: 12px; }
.sec.ref h2 { font-size: 15px; color: var(--muted); }
.row { padding: 10px 0; }
.row + .row { border-top: 1px dashed var(--line); }
.row-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row-h .v { font-weight: 600; text-align: right; }
.state { font-size: 12px; color: var(--muted); margin-left: 6px; }
.state.on { color: var(--ink); font-weight: 600; }
.cap { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--muted); }
/* zone gauge: the bar is cut at the rule's thresholds, each segment says what
   happens there, and the segment holding today's value is filled */
.gz { position: relative; margin-top: 30px; }
.gz-now { position: absolute; bottom: 100%; margin-bottom: 4px; transform: translateX(-50%); font: 600 11px/1 var(--f-mono); white-space: nowrap; }
.gz-now::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.gz-now.l { transform: none; } .gz-now.l::after { left: 1px; }
.gz-now.r { transform: translateX(-100%); } .gz-now.r::after { left: calc(100% - 1px); }
.gz-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.gz-seg { background: var(--lev-0); }
.gz-seg + .gz-seg { box-shadow: inset 2px 0 0 var(--ground); }
.gz-seg.on { background: var(--lev-15); }
.gz-ticks { position: relative; height: 16px; font: 11px/16px var(--f-mono); color: var(--muted); }
.gz-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.gz-ticks .lo { left: 0; transform: none; } .gz-ticks .hi { right: 0; transform: none; }
.gz-names { display: flex; font-size: 12px; line-height: 1.35; color: var(--muted); }
.gz-names span { text-align: center; padding: 0 2px; min-width: 0; word-break: keep-all; }
.gz-names span.on { color: var(--ink); font-weight: 600; }
.legs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.leg { font: 500 12px var(--f-mono); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); }
.leg.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* timeline chart */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.seg button { font: 500 12px var(--f-body); color: var(--muted); background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--ink); color: var(--surface); }
.cbox { position: relative; }
.plot { touch-action: pan-y; cursor: crosshair; min-height: 220px; }
.chart { display: block; overflow: visible; }
.chart .px { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
.chart .ma { fill: none; stroke: var(--lev-15); stroke-width: 1.2; stroke-dasharray: 1.5 2.5; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-strong); }
.chart .axis { font: 10px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; }
.chart .mk.up { fill: var(--buy); } .chart .mk.dn { fill: var(--sell); }
.chart .mk.lat { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
.chart .g100 { stroke: var(--line-strong); stroke-width: 1; }
.chart .etf-t { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linejoin: round; }
.chart .etf-l { fill: none; stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 5 3; }
.chart .end { font: 600 10px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; }
.chart .end.ndx { fill: var(--ink); }
.seg.tog { margin-left: 8px; }
.chart .xl { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 2; }
.chart .xd { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; top: 40px; min-width: 176px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 8px; box-shadow: 0 6px 18px -8px rgba(17, 20, 24, .3); font-size: 12px; pointer-events: none; z-index: 2; }
.tt-d { font-weight: 600; margin-bottom: 6px; }
.tt-r { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); line-height: 1.7; }
.tt-r b { color: var(--ink); }
.tt-k { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px var(--line); }
.hatch { background: repeating-linear-gradient(45deg, var(--lev-15) 0 2px, var(--lev-0) 2px 4px); }

/* history: two-line rows, never a clipped table */
.hlist { list-style: none; }
.hist { display: grid; gap: 2px; padding: 9px 0; border-top: 1px solid var(--line); }
.hist:first-child { border-top: 0; }
.hist-d { font-size: 13px; }
.hist-c { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.hist-c .what { font-size: 12px; color: var(--muted); margin-left: 6px; }
.hist.lat { opacity: .6; }
.side { font-weight: 600; font-size: 13px; white-space: nowrap; }

/* reference */
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 13px; }
@media (min-width: 640px) { .kv.two { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; column-gap: 24px; } }
.kv dt { color: var(--muted); } .kv dd { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.prose { font-size: 13px; color: var(--muted); display: grid; gap: 10px; max-width: 64ch; }
.prose b { color: var(--ink); }
.vrow { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.vrow:first-child { border-top: 0; }
.vrow .row-h .v { font-weight: 600; font-size: 12px; }
.math .row-h { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.math .row-h span:last-child { margin-left: auto; text-align: right; }
.math .row-h:first-child { border-top: 0; }
.math .row-h span:first-child { color: var(--muted); }
.foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: grid; gap: 8px; }
.foot b { color: var(--ink); }
.foot a { text-underline-offset: 2px; }
</style>
</head>

<div id="app" class="page">
  <p class="muted sm">불러오는 중…</p>
</div>

<header>
  <div class="top">

  <nav class="tabs" data-slot="nav" aria-label="전략"></nav>

<!-- ══ tab 1: tripod ══════════════════════════════════════════════════════ -->
<template id="tpl-tripod">
<section class="ticket" data-slot="ticket"></section>

<section class="sec">
  <h2>세 다리 <span class="muted sm">하나라도 빠지면 넘어진다</span></h2>
  <div data-slot="legs"></div>
</section>

<section class="sec">
  <h2>기어 타임라인</h2>
  <div data-slot="chart"></div>
  <div class="legend" data-slot="legend"></div>
  <p class="cap">위: 기간 첫날을 100으로 맞춘 로그 축. NDX(굵은 선)와 250일선(점선), TQQQ(실선)·QLD(파선). 같은 기울기는 같은 비율의 변화다 · 아래: 그날의 기어 · 그래프를 누르고 좌우로 끌면 그날 값과 실제 가격</p>
</section>

<section class="sec">

  <p class="cap" style="margin:-6px 0 8px">판정일 → 체결일. 체결은 판정 다음 거래일</p>

</section>

<section class="sec ref">
  <h2>재현 검증</h2>
  <p class="cap" style="margin:-6px 0 8px">이 구현이 원 영상의 수치를 재현하는지 대조한 것. 파라미터 추론이 맞았는지를 판단하는 근거.</p>
  <div data-slot="validation"></div>
  <div class="prose" style="margin-top:12px" data-slot="validation-note"></div>
</section>

<section class="sec ref">
  <h2>파라미터</h2>
  <dl class="kv two" data-slot="params"></dl>
  <p class="cap" style="margin-top:12px">
    † 표시된 항목은 원 영상이 명시하지 않아 <b>추론으로 확정한 값</b>이다.
    52주 낙폭을 장중 고점 기준으로 바꾸면 낙폭이 더 크게 잡혀 감속이 잦아진다.
    VIX 문턱 28은 원 저자 본인이 “최적값이 아니라 내가 감당하기로 정한 위험의 크기”라고 밝힌 튜닝 지점이다.
  </p>

<template id="tpl-voltarget">
<section class="ticket" data-slot="ticket"></section>

<section class="sec">
  <h2>왜 이렇게 나왔나 <span class="muted sm">비중 = 추세 ÷ 변동성</span></h2>
  <div data-slot="inputs"></div>
</section>

<section class="sec">
  <h2>비중 타임라인</h2>
  <div data-slot="chart"></div>
  <div class="legend" data-slot="legend"></div>
  <p class="cap">위: 나스닥100 종가(로그)와 250일선(점선) · 아래: 그날의 TQQQ 목표 비중 0–100% · 그래프를 누르고 좌우로 끌면 그날 값</p>
</section>

<section class="sec">
  <h2>최근 비중 변경</h2>
  <p class="cap" style="margin:-6px 0 8px" data-slot="exec-note">판정일 → 체결일. 체결은 판정 다음 거래일</p>
  <ul class="hlist" data-slot="events"></ul>
</section>

<!-- the arithmetic, spelled out, because a continuous weight is otherwise opaque -->
<section class="sec ref">
  <h2>오늘의 계산</h2>
  <div class="math" data-slot="math"></div>
</section>

<section class="sec ref">

  <div class="prose" data-slot="tradeoff"></div>

<section class="sec ref">
  <h2>파라미터</h2>
  <dl class="kv two" data-slot="params"></dl>
  <p class="cap" style="margin-top:12px">
    † <b>목표 변동성</b>이 이 전략의 유일한 손잡이다.
    최적값이 아니라 감당하기로 정한 위험의 크기이며, 올리면 수익과 낙폭이 같이 커진다
    (트라이팟의 VIX 28과 같은 성격의 값이다). 나머지는 백테스트 숫자를 좋게 만들려고 건드릴 값이 아니다.
  </p>
</section>

<script type="module">
const $ = (root, slot) => root.querySelector(`[data-slot="${slot}"]`);
const fmt = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 2 });
const num = (x, d = 0) => x.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, digits = 2) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(digits)}%`;

/* Korean particle 로/으로: 로 after a vowel-final syllable or a ㄹ coda,
   으로 otherwise. "1.5배로" but "현금으로". */
const ro = word => {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  if (code < 0 || code > 11171) return '로';
  const coda = code % 28;
  return (coda === 0 || coda === 8) ? '로' : '으로';
};

const app = document.getElementById('app');

function fail(message) {
  app.innerHTML = `<div class="banner err"><b>시그널을 불러올 수 없다.</b> 조용한 날이 아니다.
    <div class="sm" style="margin-top:4px">${message}</div></div>`;
}

/* ── when to execute ───────────────────────────────────────────────
   The provisional block is top-level in signal.json because it describes the
   RUN (which price, taken when), not one strategy. ADR 0005. */
function basis(L, prov) {
  const live = L.provisional && prov && prov.usable;
  const at = live ? (prov.taken_at_et || '').slice(11, 16) : '';
  return {
    live, at,
    now: Boolean(live && prov.same_session_fill),
    meta: live ? `${L.date} ${at} ET 장중 시세로 판정` : `${L.date} 종가로 판정`,
    exec: live && prov.same_session_fill ? '<b>지금 바로</b> 시장가 · MOC 마감 15:50 ET'
        : live ? '15:58 ET가 지났다 → <b>다음 거래일</b>에 체결'
        : '<b>다음 거래일</b>에 체결',
  };
}

/* The verdict is order-based, never state-based (CONTEXT.md, action_required).
   "오늘" only when the order really goes in today. */
const verdict = (n, b) => `${b.now ? '오늘 ' : ''}${n ? `주문 ${n}건` : '주문 없음'}`;

const orderRows = rows => `<ol class="orders">${rows.map((r, i) =>
  `<li class="ord ${r.side}"><span class="n mono">${i + 1}</span><span class="tk">${r.tk}</span>
   <span class="sd">${r.side === 'buy' ? '매수' : '매도'}</span><span class="amt mono">${r.amt}</span></li>`).join('')}</ol>`;

/* ── stale data ────────────────────────────────────────────────────
   A failed or skipped run leaves yesterday's numbers on screen looking exactly
   like a quiet day. Count weekdays since the judgement up to the last weekday
   before today (ET); one is a holiday at most, two means the pipeline stopped. */
function staleBanner(judged) {
  const etToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
  if (judged >= etToday) return '';
  let gap = 0;
  for (let t = new Date(judged + 'T12:00:00Z'); ;) {
    t.setUTCDate(t.getUTCDate() + 1);
    const iso = t.toISOString().slice(0, 10);
    if (iso >= etToday) break;
    if (t.getUTCDay() % 6) gap++;
  }
  if (gap < 2) return '';
  return `<div class="banner warn"><b>데이터가 오래됐다.</b> 마지막 판정은 ${judged}이고,
    그 뒤로 평일 ${gap}일이 지났다. 실행 로그를 확인하기 전에는 이 화면을 믿고 주문하지 마라.</div>`;
}

/* ── one input row: label, value, zone gauge, caption ────────────
   `cuts` are the rule's thresholds inside [lo, hi]; `names` (one more than
   cuts) say what happens in each zone. Cuts outside the range are dropped along
   with the zone they would have bounded. */
function zoneGauge({ lo, hi, cuts, names, cursor, now, unit = '', digits = 0, sign = false }) {
  const at = v => 100 * (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo);
  const edges = [lo, ...cuts, hi];
  const zones = names.map((n, i) => ({ n, a: edges[i], b: edges[i + 1] }))
    .map(z => ({ ...z, a: Math.max(lo, z.a), b: Math.min(hi, z.b) })).filter(z => z.b > z.a);
  const here = zones.findIndex(z => cursor >= z.a && (cursor < z.b || z.b === hi)) ;
  const lab = v => `${sign && v > 0 ? '+' : ''}${v.toFixed(digits).replace('-', '−')}${unit}`;
  const pos = at(cursor), side = pos < 8 ? 'l' : pos > 92 ? 'r' : '';
  return `<div class="gz">
    <span class="gz-now ${side}" style="left:${pos.toFixed(2)}%">${now}</span>
    <div class="gz-bar">${zones.map((z, i) =>
      `<i class="gz-seg ${i === here ? 'on' : ''}" style="flex:0 0 ${(at(z.b) - at(z.a)).toFixed(2)}%"></i>`).join('')}</div>
    <div class="gz-ticks"><span class="lo">${lab(lo)}</span>${zones.slice(1).map(z =>
      `<span style="left:${at(z.a).toFixed(2)}%">${lab(z.a)}</span>`).join('')}<span class="hi">${lab(hi)}</span></div>
    <div class="gz-names">${zones.map((z, i) =>
      `<span class="${i === here ? 'on' : ''}" style="flex:0 0 ${(at(z.b) - at(z.a)).toFixed(2)}%">${z.n}</span>`).join('')}</div>
  </div>`;
}

function gaugeRow({ label, state, on, value, gauge = '', cap, extra = '' }) {
  return `<div class="row">
    <div class="row-h"><span>${label}${state ? `<span class="state ${on ? 'on' : ''}">${state}</span>` : ''}</span>
      <span class="v mono">${value}</span></div>
    ${extra}${gauge}
    <p class="cap">${cap}</p></div>`;
}

const kv = (label, value, inferred) => `<dt>${label}${inferred ? ' †' : ''}</dt><dd>${value}</dd>`;
const shortExec = e => e.exec_date ? e.exec_date.slice(5) : '다음 거래일';

/* ── timeline chart ────────────────────────────────────────────────
   Drawn after mount (it needs the real width), redrawn on resize and on range
   change. Change markers sit on the price line, clear of its local envelope,
   so a one-day blip is never invisible and the line is never covered. */
const charts = [];
const ETF_LINES = [{ k: 't', name: 'TQQQ', cls: 'etf-t' }, { k: 'l', name: 'QLD', cls: 'etf-l' }];
const RANGES = [[63, '3개월'], [252, '1년'], [756, '3년']];

function chartBox(node, kind, series, gears) {
  const box = document.createElement('div');
  box.className = 'cbox';
  box.innerHTML = `<div class="seg" role="group" aria-label="기간">${RANGES.map(([n, t]) =>
      `<button type="button" data-r="${n}" class="${n === 252 ? 'on' : ''}">${t}</button>`).join('')}</div>
    ${kind === 'tripod' && series.some(p => p.t) ? `<div class="seg tog" role="group" aria-label="ETF 선">${ETF_LINES.map(e =>
      `<button type="button" data-k="${e.k}" aria-pressed="true" class="on">${e.name}</button>`).join('')}</div>` : ''}
    <div class="plot"></div><div class="tip" hidden></div>`;
  const state = { box, kind, gears, range: 252, show: { t: true, l: true },
    pts: series.map(p => ({ ...p, m: typeof p.ma === 'object' ? p.ma?.['250'] : p.ma }))
               .filter(p => p.c && p.m && (kind === 'tripod' ? p.g : p.w !== null && p.w !== undefined)) };
  box.querySelectorAll('.seg:not(.tog) button').forEach(b => b.onclick = () => {
    state.range = +b.dataset.r;
    box.querySelectorAll('.seg:not(.tog) button').forEach(x => x.classList.toggle('on', x === b));
    drawChart(state);
  });
  box.querySelectorAll('.tog button').forEach(b => b.onclick = () => {
    const on = !state.show[b.dataset.k];
    state.show[b.dataset.k] = on;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    drawChart(state);
  });
  $(node, 'chart').replaceChildren(box);
  charts.push(state);
}

function drawChart(st) {
  const { box, kind, gears } = st;
  const s = st.pts.slice(-st.range);
  const plot = box.querySelector('.plot'), tip = box.querySelector('.tip');
  const W = plot.clientWidth;
  if (!W || s.length < 2) return;
  // Tripod overlays the ETFs it holds. Prices that far apart cannot share an
  // axis, so every line is rebased to 100 on the window's first day, on a log
  // scale where equal slopes are equal percentage moves. NDX and its MA rebase
  // together so their gap still reads as the regime distance.
  const rebase = kind === 'tripod';
  const etf = rebase ? ETF_LINES.filter(e => st.show[e.k] && s[0][e.k]) : [];
  const k0 = rebase ? 100 / s[0].c : 1;
  const P = p => p.c * k0, M = p => p.m * k0;
  const R = (e, p) => (p[e.k] / s[0][e.k]) * 100;
  const PH = rebase ? 180 : 150, GAP = 10, WH = 44, AX = 16, PAD = 18;
  const RW = etf.length ? 46 : 0;           // right gutter for end-of-line labels
  const XW = W - RW;
  const base = PH + GAP + WH, H = base + AX;
  const vals = s.flatMap(p => [P(p), M(p), ...etf.filter(e => p[e.k]).map(e => R(e, p))]);
  const lo = Math.log(Math.min(...vals)), hi = Math.log(Math.max(...vals));
  const X = i => (i / (s.length - 1)) * XW;
  const Y = v => PAD + (1 - (Math.log(v) - lo) / (hi - lo)) * (PH - 2 * PAD);
  const line = f => 'M' + s.map((p, i) => `${X(i).toFixed(1)},${Y(f(p)).toFixed(1)}`).join('L');
  // ETF lines may have gaps (a provisional bar has no ETF close): restart the path.
  const gapLine = e => s.map((p, i) => p[e.k] ? `${i && s[i - 1][e.k] ? 'L' : 'M'}${X(i).toFixed(1)},${Y(R(e, p)).toFixed(1)}` : '').join('');
  const lev = p => kind === 'voltarget' ? p.w : gears[p.g].leverage;
  const hid = `hatch-${kind}`;

  let lower = '';
  if (kind === 'voltarget') {
    // A step function: the weight holds until the deadband releases, so it is
    // never interpolated.
    const wy = w => base - w * WH;
    let d = `M0,${base}L0,${wy(s[0].w).toFixed(1)}`;
    for (let i = 1; i < s.length; i++) d += `L${X(i).toFixed(1)},${wy(s[i - 1].w).toFixed(1)}L${X(i).toFixed(1)},${wy(s[i].w).toFixed(1)}`;
    lower = `<path d="${d}L${XW},${base}Z" fill="var(--lev-15)"/>`;
  } else {
    const fill = { G3: 'var(--lev-3)', G15_UP: 'var(--lev-15)', G15_DOWN: `url(#${hid})`, CASH: 'var(--lev-0)' };
    for (let i = 0; i < s.length;) {
      let j = i; while (j + 1 < s.length && s[j + 1].g === s[i].g) j++;
      const x0 = X(i), x1 = j + 1 < s.length ? X(j + 1) : XW;
      lower += `<rect x="${x0.toFixed(1)}" y="${PH + GAP}" width="${Math.max(x1 - x0, 2).toFixed(1)}" height="${WH}" fill="${fill[s[i].g]}"/>`;
      i = j + 1;
    }
  }

  let marks = '';
  const span = Math.max(1, Math.round((5 / W) * (s.length - 1)));
  for (let i = 1; i < s.length; i++) {
    const a = lev(s[i - 1]), b = lev(s[i]);
    if (a === b && (kind === 'voltarget' || s[i].g === s[i - 1].g)) continue;
    let top = Infinity, bot = -Infinity;
    for (let j = Math.max(0, i - span); j <= Math.min(s.length - 1, i + span); j++) {
      const yy = Y(P(s[j])); top = Math.min(top, yy); bot = Math.max(bot, yy);
    }
    const x = X(i).toFixed(1), G = 5;
    marks += b > a ? `<path d="M${x},${(bot + G).toFixed(1)} l4.5,7 h-9 Z" class="mk up"/>`
           : b < a ? `<path d="M${x},${(top - G).toFixed(1)} l4.5,-7 h-9 Z" class="mk dn"/>`
           : `<path d="M${x},${(top - G - 7).toFixed(1)} l3.5,3.5 l-3.5,3.5 l-3.5,-3.5 Z" class="mk lat"/>`;
  }

  let ax = '';
  const short = st.range <= 63;
  const key = d => short ? d.slice(0, 7) : d.slice(0, 4);
  for (let i = 1; i < s.length; i++) if (key(s[i].d) !== key(s[i - 1].d)) {
    const lbl = short ? `${+s[i].d.slice(5, 7)}월` : s[i].d.slice(0, 4);
    ax += `<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="0" y2="${base}" class="grid"/>
      <text x="${(X(i) + 3).toFixed(1)}" y="${base + 13}" class="axis">${lbl}</text>`;
  }

  // rebased scale: a few labelled gridlines, 100 (the window start) emphasised
  let yg = '', ends = '';
  if (rebase) {
    const [vmin, vmax] = [Math.exp(lo), Math.exp(hi)];
    for (const v of [10, 25, 50, 75, 100, 150, 200, 300, 400, 600, 800, 1200]) {
      if (v < vmin || v > vmax) continue;
      yg += `<line x1="0" x2="${XW}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="${v === 100 ? 'g100' : 'grid'}"/>
        <text x="2" y="${(Y(v) - 3).toFixed(1)}" class="axis">${v}</text>`;
    }
    // end labels, nudged apart so they never overlap
    const last = s.length - 1;
    const lab = [{ name: 'NDX', y: Y(P(s[last])), cls: 'ndx' },
      ...etf.filter(e => s[last][e.k] ?? s[last - 1]?.[e.k]).map(e => {
        const q = s[last][e.k] ? s[last] : s[last - 1];
        return { name: e.name, y: Y(R(e, q)), cls: e.cls };
      })].sort((a, b) => a.y - b.y);
    for (let i = 1; i < lab.length; i++) lab[i].y = Math.max(lab[i].y, lab[i - 1].y + 12);
    ends = lab.map(l => `<text x="${XW + 4}" y="${(l.y + 3.5).toFixed(1)}" class="end ${l.cls}">${l.name}</text>`).join('');
  }

  plot.innerHTML = `<svg width="${W}" height="${H}" class="chart" role="img"
      aria-label="나스닥100 종가와 ${kind === 'voltarget' ? 'TQQQ 비중' : '기어'} 타임라인">
    <defs><pattern id="${hid}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="var(--lev-0)"/><line x1="0" y1="0" x2="0" y2="4" stroke="var(--lev-15)" stroke-width="2"/></pattern></defs>
    ${ax}${yg}<path d="${line(M)}" class="ma"/>${etf.slice().reverse().map(e => `<path d="${gapLine(e)}" class="${e.cls}"/>`).join('')}
    <path d="${line(P)}" class="px"/>${lower}${marks}${ends}
    <line x1="0" x2="${XW}" y1="${base}" y2="${base}" class="base"/>
    <g class="xh" visibility="hidden"><line y1="0" y2="${base}" class="xl"/><circle r="3.5" class="xd"/></g></svg>`;

  const xh = plot.querySelector('.xh'), xl = xh.querySelector('line'), xd = xh.querySelector('circle');
  const show = ev => {
    const r = plot.getBoundingClientRect();
    const i = Math.max(0, Math.min(s.length - 1, Math.round(((ev.clientX - r.left) / XW) * (s.length - 1))));
    const p = s[i], x = X(i);
    xl.setAttribute('x1', x); xl.setAttribute('x2', x);
    xd.setAttribute('cx', x); xd.setAttribute('cy', Y(P(p)));
    xh.setAttribute('visibility', 'visible');
    const rowf = (k, v, cls = '') => `<div class="tt-r ${cls}"><span>${k}</span><b class="mono">${v}</b></div>`;
    tip.innerHTML = `<div class="tt-d mono">${p.d}${p.provisional ? ' 장중' : ''}</div>` +
      rowf('NDX', num(p.c, 2)) + rowf('250일선 대비', pct((p.c / p.m - 1) * 100)) +
      (kind === 'voltarget'
        ? rowf('TQQQ 비중', `${num(p.w * 100)}%`, 'tt-k') + rowf('추세 투표', `${num(p.vote * 4)}/4`) +
          rowf('실현변동성', `${num(p.rv * 100, 1)}%`) + rowf('원시 목표', `${num(p.raw * 100, 1)}%`)
        : `<div class="tt-r tt-k"><span>기어</span><b>${gears[p.g].ko}</b></div>` +
          rowf('VIX 10일', num(p.v, 2)) + rowf('52주 낙폭', pct(p.dd * 100)) +
          // actual closes, and the move since the window's first day
          [['q', 'QQQ'], ['l', 'QLD'], ['t', 'TQQQ']].filter(([k]) => p[k] && s[0][k]).map(([k, n], j) =>
            rowf(n, `${num(p[k], 2)} <span class="muted">${pct((p[k] / s[0][k] - 1) * 100, 0)}</span>`, j ? '' : 'tt-k')).join(''));
    tip.hidden = false;
    const tw = tip.offsetWidth;
    tip.style.left = `${x + 12 + tw > W ? Math.max(0, x - 12 - tw) : x + 12}px`;
  };
  const hide = () => { xh.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  plot.onpointermove = show;
  plot.onpointerdown = show;
  plot.onpointerleave = hide;
  plot.onpointerup = ev => { if (ev.pointerType !== 'mouse') hide(); };
}

/* ── tab 1 render ────────────────────────────────────────────────── */
function renderTripod(st, root) {
  const node = document.getElementById('tpl-tripod').content.cloneNode(true);
  const L = st.latest, P = st.params, G = st.gears, S = st.stats;
  const gear = G[L.gear], prev = G[L.prev_gear];
  const b = basis(L, root.provisional);
  const o = L.orders;

  /* Three states, not two: a gear key can change while the book does not. */
  const rows = L.action_required ? [
    ...o.sell.map(t => ({ tk: t, side: 'sell', amt: '전량' })),
    ...o.buy.map(t => ({ tk: t, side: 'buy', amt: `${(gear.weights[t] * 100).toFixed(0)}%` })),
  ] : [];
  $(node, 'ticket').innerHTML = `
    <div class="t-meta">트라이팟 · ${b.meta}</div>
    <div class="verdict">${verdict(rows.length, b)}</div>
    ${L.action_required
      ? `${orderRows(rows)}${o.keep.length ? `<p class="keep">${o.keep.join(', ')}는 그대로 보유</p>` : ''}
         <div class="t-sub"><span class="mono">${prev.leverage}x → <b>${gear.leverage}x</b></span> · ${gear.ko} · ${b.exec}</div>`
      : `<div class="book">${gear.label}</div>
         <div class="t-sub">${L.regime_only_change
           ? `레짐만 바뀌었다: ${prev.ko} → <b>${gear.ko}</b>${ro(gear.ko)}. 보유 종목이 같아 <b>낼 주문이 없다</b>
              (35년 동안 ${S.regime_only_changes}회 있었던 경우).`
           : `보유 유지 · ${gear.ko} · 계좌 배수 ${gear.leverage}x ·
              <b>${L.days_since_change}일</b>째 그대로 (${L.sessions_since_change}거래일).
              연평균 ${S.changes_per_year}회만 움직인다.`}</div>`}`;

  const ma = L.legs.ma, vx = L.legs.vix, dd = L.legs.dd;
  const vixOk = L.regime === 'up' ? vx.value < P.vix_hot : vx.value < P.vix_panic;
  const ddOk = dd.value / 100 >= P.dd_trigger;
  const up = L.regime === 'up';
  const upLine = P.up_band * 100, downLine = -P.down_band * 100;
  $(node, 'legs').innerHTML = [
    gaugeRow({
      label: `방향 <span class="muted sm">NDX vs ${P.ma_length}일선</span>`,
      state: up ? '상승 레짐' : '하락 레짐', on: !up,
      value: pct(ma.dist_pct),
      gauge: zoneGauge({
        lo: Math.min(-15, ma.dist_pct - 2), hi: Math.max(15, ma.dist_pct + 2),
        cuts: [downLine, upLine], names: ['하락 레짐', '직전 유지', '상승 레짐'],
        cursor: ma.dist_pct, now: pct(ma.dist_pct), unit: '%', sign: true,
      }),
      cap: `종가 ${fmt.format(L.close)} · ${P.ma_length}일선 ${fmt.format(ma.value)}. 종가가 이평선보다 ${upLine}% 넘게 위면 상승, ${-downLine}% 넘게 아래면 하락, 그 사이는 어제 레짐을 그대로 쓴다.`,
    }),
    gaugeRow({
      label: `공포 <span class="muted sm">VIX ${P.vix_ma_length}일 평균</span>`,
      state: vixOk ? '통과' : '작동', on: !vixOk,
      value: fmt.format(vx.value),
      gauge: up
        ? zoneGauge({ lo: 8, hi: Math.max(45, vx.value + 5), cuts: [P.vix_hot], names: ['3배 유지', '1.5배로 감속'],
                      cursor: vx.value, now: fmt.format(vx.value) })
        : zoneGauge({ lo: 8, hi: Math.max(45, vx.value + 5), cuts: [P.vix_panic], names: ['1.5배', '전량 현금'],
                      cursor: vx.value, now: fmt.format(vx.value) }),
      cap: up
        ? `상승 레짐이라 문턱은 ${P.vix_hot}. 지금보다 ${vx.to_hot > 0 ? '+' : ''}${vx.to_hot} 오르면 감속한다. (하락 레짐이면 문턱 ${P.vix_panic}에서 현금)`
        : `하락 레짐이라 문턱은 ${P.vix_panic}. ${vx.to_panic > 0 ? `+${vx.to_panic} 오르면 현금으로 간다` : '이미 넘어서 현금이다'}. (상승 레짐이면 문턱 ${P.vix_hot}에서 감속)`,
    }),
    gaugeRow({
      label: '피로도 <span class="muted sm">52주 낙폭</span>',
      state: !up ? '하락 레짐엔 안 씀' : ddOk ? '통과' : '작동', on: up && !ddOk,
      value: `${dd.value.toFixed(2)}%`,
      gauge: zoneGauge({
        lo: Math.min(-25, dd.value - 3), hi: 0, cuts: [P.dd_trigger * 100],
        names: [up ? '1.5배로 감속' : '감속 (상승 레짐일 때)', up ? '3배 유지' : '통과'],
        cursor: dd.value, now: `${dd.value.toFixed(2)}%`, unit: '%',
      }),
      cap: `52주 종가 고점 ${fmt.format(dd.peak)}에서 얼마나 내려왔나. 오른쪽 끝 0%가 고점이다. ${dd.trigger}%보다 깊어지면 상승 레짐에서도 감속하고, 지금은 ${dd.to_trigger_pp.toFixed(2)}%p 남았다.`,
    }),
  ].join('');

  chartBox(node, 'tripod', st.series, G);
  const sw = { G3: 'background:var(--lev-3)', G15_UP: 'background:var(--lev-15)', G15_DOWN: '', CASH: 'background:var(--lev-0)' };
  $(node, 'legend').innerHTML = Object.entries(G).map(([k, g]) =>
    `<span class="nowrap"><i class="${k === 'G15_DOWN' ? 'hatch' : ''}" style="${sw[k]}"></i>${g.ko}
       <span class="mono">${S.occupancy_pct[k] ?? 0}%</span></span>`).join('') +
    `<span class="nowrap"><b class="buy">▲</b> 증속 <b class="sell">▼</b> 감속 ◇ 상태만 변경</span>`;

  $(node, 'events').innerHTML = st.events.filter(e => e.from).slice(-6).reverse().map(e => {
    const up = G[e.to].leverage > G[e.from].leverage;
    const what = e.trade
      ? [e.sell.length ? `${e.sell.join('+')} 매도` : '', e.buy.length ? `${e.buy.join('+')} 매수` : ''].filter(Boolean).join(' → ')
      : '보유 종목 동일';
    const side = !e.trade ? '<span class="side muted">주문 없음</span>'
      : up ? '<span class="side buy">▲ 증속</span>' : '<span class="side sell">▼ 감속</span>';
    return `<li class="hist ${e.trade ? '' : 'lat'}">
      <div class="hist-d mono">${e.date} <span class="muted">→ ${shortExec(e)}</span></div>
      <div class="hist-c"><span><span class="mono">${G[e.from].leverage}x → <b>${G[e.to].leverage}x</b></span>
        <span class="what">${what}</span></span>${side}</div></li>`;
  }).join('');

  const v = [
    ['백테스트 기간', '35년', `${S.span_years}년`, true],
    ['연평균 매매 횟수', '8.1회', `${S.changes_per_year}회`, true],
    ['매매 간격 중앙값', '6일', `${S.median_gap_days}일`, true],
    ['무매매 연도 수', '5년', `${S.zero_trade_years.length}년 (${S.zero_trade_years.join(', ')})`, true],
    ['최장 무매매 기간', '2년 7개월', `${S.longest_no_change_days}일`, true],
    ['감속·현금화 횟수', '55회', `${S.downshifts}회`, false],
  ];
  $(node, 'validation').innerHTML = v.map(([k, a, mine, match]) => `<div class="vrow">
    <div class="row-h"><span>${k}</span><span class="v">${match ? '일치' : '<span class="state on" style="margin:0">불일치</span>'}</span></div>
    <div class="muted sm mono">영상 ${a} · 이 구현 <b style="color:var(--ink)">${mine}</b></div></div>`).join('');
  $(node, 'validation-note').innerHTML = `
    <p>매매 횟수는 <b>실제 주문이 발생한 ${S.trade_events}회</b> 기준이다.
      기어 키가 바뀐 것만 세면 ${S.gear_changes}회(연 8.07회)인데, 차이인 ${S.regime_only_changes}회는
      1.5배(상승) ↔ 1.5배(하락) 전환으로 <b>보유 종목이 같아 주문이 없다</b>.
      영상의 8.1회는 어느 쪽으로 세도 근사하므로 원 저자가 이 구분을 했는지는 알 수 없다.</p>
    <p>감속 횟수만 불일치한다. 3배를 벗어난 구간은 127개 에피소드이고 그중 4일 이상 지속된 것이 약 55개다.
      원 영상이 짧은 되돌림을 어떻게 병합했는지 밝히지 않아 미해결로 둔다.
      나머지 5개 지표가 모두 일치하므로 파라미터 추론 자체는 맞다고 본다.</p>`;

  $(node, 'params').innerHTML = [
    kv('기준 지수', '^NDX', true),
    kv('이동평균', `${P.ma_length}일 ${P.ma_kind.toUpperCase()}`, true),
    kv('상승 밴드', `MA +${(P.up_band * 100).toFixed(0)}%`),
    kv('하락 밴드', `MA −${(P.down_band * 100).toFixed(0)}%`),
    kv('중립 구간', '직전 상태 유지'),
    kv('VIX 평균', `${P.vix_ma_length}일 SMA`),
    kv('VIX 감속 문턱', `${P.vix_hot}`),
    kv('VIX 현금 문턱', `${P.vix_panic}`),
    kv('52주 낙폭 기준', `${P.dd_lookback}거래일 · ${P.dd_basis === 'close' ? '종가' : '장중'} 고점`, true),
    kv('낙폭 트리거', `${(P.dd_trigger * 100).toFixed(0)}%`),
    kv('체결', '판정 다음 거래일'),
    kv('VIX 결측 보정', `${S.vix_filled_sessions}거래일 전일값`),
  ].join('');

  return node;
}

/* ── tab 2 render ────────────────────────────────────────────────── */
function renderVolTarget(st, tripodStats, root) {
  const cashTicker = st.cash_ticker || 'SGOV';
  const node = document.getElementById('tpl-voltarget').content.cloneNode(true);
  const L = st.latest, P = st.params, S = st.stats, I = L.inputs;
  const b = basis(L, root.provisional);
  const acted = L.action_required;
  const heldBefore = 100 * L.prev_weight;
  const pp = `${Math.abs(L.delta_pp).toFixed(0)}%p`;
  const buying = L.side === 'buy';

  // Same order as the Telegram message (scripts/notify.py).
  const rows = acted ? [
    { tk: 'TQQQ', side: buying ? 'buy' : 'sell', amt: pp },
    { tk: cashTicker, side: buying ? 'sell' : 'buy', amt: pp },
  ] : [];
  $(node, 'ticket').innerHTML = `
    <div class="t-meta">변동성 타겟 · ${b.meta}</div>
    <div class="verdict">${verdict(rows.length, b)}</div>
    ${acted
      ? `${orderRows(rows)}
         <div class="t-sub"><span class="mono">TQQQ ${heldBefore.toFixed(0)}% → <b>${L.weight_pct.toFixed(0)}%</b></span>
           · 계좌 배수 ${L.leverage.toFixed(2)}x · ${b.exec}</div>`
      : `<div class="book">TQQQ ${L.weight_pct.toFixed(0)}% <span class="muted">·</span> ${cashTicker} ${L.cash_pct.toFixed(0)}%</div>
         <div class="t-sub">보유 유지 · 계좌 배수 ${L.leverage.toFixed(2)}x ·
           <b>${L.days_since_change}일</b>째 그대로 (${L.sessions_since_change}거래일).
           연평균 ${S.changes_per_year}회 움직인다 — 트라이팟(${tripodStats.changes_per_year}회)보다 훨씬 자주다.</div>`}`;

  $(node, 'exec-note').textContent = b.now
    ? '판정일 → 체결일. 장중 판정은 같은 날 종가에 체결'
    : '판정일 → 체결일. 체결은 판정 다음 거래일';

  /* The vote counts LATCHED legs, not raw comparisons. Inside the ±1% band a leg
     keeps its old state, so a leg can read "on" while price sits just below its
     MA — mark those so the vote never looks like an arithmetic error. */
  const lens = P.ma_lengths;
  const carried = n => I.legs && I.legs[String(n)] !== I.ma_above[String(n)];
  const chips = lens.map(n => {
    const on = I.legs?.[String(n)] ?? I.ma_above[String(n)];
    return `<span class="leg ${on ? 'on' : ''}">${n}${carried(n) ? '*' : ''}</span>`;
  }).join('');
  const dists = lens.map(n => `${n}일 ${pct(I.ma_dist_pct[String(n)], 1)}${carried(n) ? '*' : ''}`).join(' · ');
  const anyCarried = lens.some(carried);

  /* The deadband is tested against the SNAPPED target, not the raw number, so
     that is the gap to report. Raw 98.3% snaps to 100%, which is 10pp from a
     held 90% and therefore releases — quoting the raw gap (8pp) would look like
     it fired below its own threshold. The band is measured against what was
     held BEFORE today's decision. */
  const snappedPct = Math.round(I.raw_pct / I.step_pp) * I.step_pp;
  const gapPct = Math.abs(snappedPct - heldBefore);
  const rv100 = I.vote * I.target_vol_pct / 3;  // realised vol at which raw hits 100%

  $(node, 'inputs').innerHTML = [
    gaugeRow({
      label: '추세 투표', state: I.vote >= 0.5 ? '추세' : '약세', on: I.vote < 0.5,
      value: `${I.above}/${I.of}`, extra: `<div class="legs">${chips}</div>`,
      cap: `켜진 이동평균 수 · ${dists}${anyCarried ? `<br>* ±${I.ma_band_pct}% 밴드 안이라 직전 상태 유지` : ''}`,
    }),
    gaugeRow({
      label: '실현변동성', state: I.vote ? `원시 목표 ${I.raw_pct.toFixed(1)}%` : '투표 0 → 비중 0%', on: false,
      value: `${I.rvol_pct.toFixed(1)}%`,
      /* No threshold in the rule: the weight is continuous. The useful cuts are
         where today's vote would put the raw target at 100% and at 50%. */
      gauge: zoneGauge({
        lo: 0, hi: Math.max(60, I.rvol_pct + 5),
        cuts: I.vote ? [rv100, rv100 * 2] : [],
        names: I.vote ? ['목표 100%', '50~100%', '50% 미만'] : ['투표 0이라 비중 0%'],
        cursor: I.rvol_pct, now: `${I.rvol_pct.toFixed(1)}%`, unit: '%', digits: 1,
      }),
      cap: `${P.vol_windows.join('·')}일 표준편차 평균. 원시 목표 = 투표 ${I.vote.toFixed(2)} × ${I.target_vol_pct}% ÷ (3 × 변동성)이라 왼쪽일수록 비중이 크다.${I.vote ? ` 지금 투표로는 ${rv100.toFixed(1)}% 아래면 100%, ${(rv100 * 2).toFixed(1)}%면 50%.` : ''}`,
    }),
    gaugeRow({
      label: '목표 비중', state: acted ? '데드밴드 해제' : '데드밴드 유지', on: acted,
      value: `${I.raw_pct.toFixed(1)}% → ${snappedPct.toFixed(0)}% → <b>${L.weight_pct.toFixed(0)}%</b>`,
      gauge: zoneGauge({
        lo: 0, hi: 100, cuts: [heldBefore - I.band_pp, heldBefore + I.band_pp],
        names: ['줄인다', `${heldBefore.toFixed(0)}% 유지`, '늘린다'],
        cursor: snappedPct, now: `격자 ${snappedPct.toFixed(0)}%`, unit: '%',
      }),
      cap: acted
        ? `원시 ${I.raw_pct.toFixed(1)}% → ${I.step_pp}%p 격자 ${snappedPct.toFixed(0)}%. 어제 보유 ${heldBefore.toFixed(0)}%와 ${gapPct.toFixed(0)}%p 차라 <b>${I.band_pp}%p 데드밴드를 벗어났다</b>.`
        : `원시 ${I.raw_pct.toFixed(1)}% → ${I.step_pp}%p 격자 ${snappedPct.toFixed(0)}%. 보유 ${heldBefore.toFixed(0)}% ±${I.band_pp}%p 안이라 그대로 둔다. 격자 목표가 가운데 구간을 벗어나야 주문이 나온다.`,
    }),
  ].join('');

  const step = (label, value) => `<div class="row-h"><span>${label}</span><span class="mono">${value}</span></div>`;
  $(node, 'math').innerHTML =
    step('추세 투표 (켜진 이동평균 수)', `${I.above} / ${I.of} = ${I.vote.toFixed(2)}`) +
    step('목표 변동성 ÷ (3배 × 실현변동성)',
         `${I.target_vol_pct}% ÷ (3 × ${I.rvol_pct.toFixed(1)}%) = ${(I.target_vol_pct / (3 * I.rvol_pct)).toFixed(2)}`) +
    step('원시 목표 = 투표 × 위 값', `${I.raw_pct.toFixed(1)}%`) +
    step(`${I.step_pp}%p 격자로 반올림`, `${snappedPct.toFixed(0)}%`) +
    step(`데드밴드(${I.band_pp}%p) 적용 후 실행 비중`, `<b>TQQQ ${L.weight_pct.toFixed(0)}%</b>`);

  chartBox(node, 'voltarget', st.series, null);
  $(node, 'legend').innerHTML =
    `<span class="nowrap"><i style="background:var(--lev-15)"></i>TQQQ 목표 비중 <span class="mono">평균 ${S.avg_weight_pct}%</span></span>
     <span class="nowrap">전량 ${cashTicker} <span class="mono">${S.fully_cash_pct}%</span></span>
     <span class="nowrap">평균 배수 <span class="mono">${S.avg_leverage}x</span></span>
     <span class="nowrap"><b class="buy">▲</b> 비중 증가 <b class="sell">▼</b> 비중 감소</span>`;

  $(node, 'events').innerHTML = st.events.filter(e => e.from !== null).slice(-6).reverse().map(e => {
    const up = e.delta > 0;
    return `<li class="hist">
      <div class="hist-d mono">${e.date} <span class="muted">→ ${shortExec(e)}</span></div>
      <div class="hist-c"><span class="mono">${(e.from * 100).toFixed(0)} → <b>${(e.to * 100).toFixed(0)}%</b></span>
        <span class="side ${up ? 'buy' : 'sell'}">${up ? '매수' : '매도'} ${Math.abs(e.delta * 100).toFixed(0)}%p</span></div></li>`;
  }).join('');

  /* honest tradeoff against the other tab */
  $(node, 'tradeoff').innerHTML = `
    <p><b>손이 훨씬 많이 간다.</b>
      연 <span class="mono">${S.changes_per_year}회</span> 움직인다. 트라이팟은
      <span class="mono">${tripodStats.changes_per_year}회</span>다. 최장 무변경 구간도
      <span class="mono">${S.longest_no_change_days}일</span> vs
      <span class="mono">${tripodStats.longest_no_change_days}일</span>이다.
      “매일 볼 이유가 없다”는 트라이팟의 장점이 여기서는 성립하지 않는다.</p>
    <p><b>과세계좌에서는 단순보유에 진다.</b>
      로트 단위로 세금을 계산해 보면 드래그가 <span class="mono">3.6~4.6pp</span>다.
      목표 변동성 35%는 세전 16.8%가 세후 <span class="mono">13.2%</span>가 되어
      레버리지 없는 나스닥 단순보유(<span class="mono">14.2%</span>)보다 낮다.
      <b>회전을 줄여도 해결되지 않는다</b> — 데드밴드를
      넓혀 회전을 4.5배 줄여도 드래그는 3.64→3.09pp뿐이고(세금은 거래 <em>횟수</em>가
      아니라 실현이익 <em>금액</em>에 비례한다) 추적이 나빠져 MDD가 −54.6%→−75.6%로
      무너진다. 답은 파라미터가 아니라 계좌다: <b>IRA·401k에서
      돌리면 16.7%</b>(+3.54pp)로, 측정한 모든 레버 중 가장 크다.</p>
    <p><b>변동성은 뒤를 본다.</b>
      ${P.vol_windows.join('·')}일 창이라 급락 <em>이후에</em> 비중을 줄인다.
      1987년·2020년 같은 갭 하락의 첫 방은 그대로 맞는다.</p>
    <p><b>히스테리시스는 트라이팟에서 빌려왔다.</b>
      이동평균 4개 각각에 ±${I.ma_band_pct}% 밴드를 둬 밴드 안에서는 직전 상태를 유지한다.
      이게 없으면 이동평균 하나를 스치는 것만으로 목표가 25%p 움직여 데드밴드를 뚫고,
      50일선 근처에서 하루 만에 45%p를 왕복한다. 넣으면 같은 주 내 반전이 95회 → 9회로 줄고
      낙폭은 오히려 좋아진다. 성과를 위한 손질이 아니라 <em>운용 가능성</em>을 산 것이다.</p>
    <p><b>VIX를 쓰지 않는다.</b>
      그래서 히스토리가 트라이팟보다 4년 길고(<span class="mono">${S.span_years}년</span> vs
      <span class="mono">${tripodStats.span_years}년</span>) CBOE 파일에 의존하지 않는다.</p>`;

  $(node, 'params').innerHTML = [
    kv('기준 지수', '^NDX'),
    kv('추세 이동평균', `${P.ma_lengths.join('/')}일 ${P.ma_kind.toUpperCase()}`),
    kv('이동평균 밴드', `±${(P.ma_band * 100).toFixed(0)}%`),
    kv('변동성 창', `${P.vol_windows.join('/')}일`),
    kv('목표 변동성', `${(P.target_vol * 100).toFixed(0)}%`, true),
    kv('대상 ETF 배수', `${P.etf_leverage}x (TQQQ)`),
    kv('최대 비중', `${(P.max_weight * 100).toFixed(0)}%`),
    kv('비중 격자', `${(P.weight_step * 100).toFixed(0)}%p`),
    kv('리밸런싱 밴드', `${(P.rebalance_band * 100).toFixed(0)}%p`),
    kv('변동성 하한', `${(P.vol_floor * 100).toFixed(0)}%`),
    kv('체결', '판정 다음 거래일'),
    kv('평균 비중', `${S.avg_weight_pct}% (${S.avg_leverage}x)`),
    kv(`전량 ${cashTicker} 비율`, `${S.fully_cash_pct}%`),
  ].join('');

  return node;
}

/* ── shell + routing ─────────────────────────────────────────────── */
const RENDERERS = {
  tripod: d => renderTripod(d.strategies.tripod, d),
  voltarget: d => renderVolTarget(d.strategies.voltarget, d.strategies.tripod.stats, d),
};

function render(d, key) {
  const nav = d.nav ?? [{ key: 'tripod', ko: '트라이팟' }];
  const active = RENDERERS[key] ? key : nav[0].key;
  const shell = document.getElementById('tpl-shell').content.cloneNode(true);
  const L = d.strategies[active].latest;
  const b = basis(L, d.provisional);

  $(shell, 'stamp').textContent = b.live ? `${L.date.slice(5)} ${b.at} ET 장중` : `${L.date} 종가`;
  $(shell, 'generated').textContent = `데이터 갱신 ${d.generated_at.slice(0, 16).replace('T', ' ')}Z`;
  $(shell, 'banner').innerHTML = staleBanner(L.date);

  /* Nav doubles as the alert surface: a tab whose strategy wants a trade today
     carries a dot, so switching tabs is never how you find out. */
  $(shell, 'nav').innerHTML = nav.map(s => {
    const alert = d.strategies[s.key]?.latest?.action_required;
    return `<a class="tab" href="#${s.key}" ${s.key === active ? 'aria-current="page"' : ''}>${s.ko}${
      alert ? '<i class="dot" title="주문 있음"></i>' : ''}</a>`;
  }).join('');

  charts.length = 0;
  $(shell, 'body').replaceChildren(RENDERERS[active](d));
  app.replaceChildren(shell);
  charts.forEach(drawChart);
}

const currentKey = () => (location.hash || '').replace(/^#/, '');

/* data/signal.js sets window.__SIGNAL__ and works from any origin including
   file://. Over http the fetch path is preferred so a cached signal.js can
   never win over fresh data. */
const embedded = window.__SIGNAL__;
const isFile = location.protocol === 'file:';

function boot(d) {
  render(d, currentKey());
  addEventListener('hashchange', () => render(d, currentKey()));
  let t;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => charts.forEach(drawChart), 100); });
  document.fonts?.ready.then(() => charts.forEach(drawChart));
}

if (isFile) {
  embedded
    ? boot(embedded)
    : fail('data/signal.js 를 찾을 수 없다. <code>python scripts/signal.py</code> 를 실행해 생성하라.');
} else {
  fetch(`data/signal.json?v=${Date.now()}`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(boot)
    .catch(e => embedded
      ? boot(embedded)
      : fail(`data/signal.json — ${e.message}`));
}
